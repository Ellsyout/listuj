<!doctype html>
<html lang="cs" data-theme="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>Listuj – najdi svou další knihu</title>
<meta name="description" content="Listuj: vyber žánr nebo autora a najdi knihy z celého světa.">
<meta name="application-name" content="Listuj">
<meta name="apple-mobile-web-app-title" content="Listuj">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5dfc'/%3E%3Cstop offset='1' stop-color='%23c04bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M14 20c7-3 13-2 18 2v24c-5-4-11-5-18-2zM50 20c-7-3-13-2-18 2v24c5-4 11-5 18-2z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Barevná témata ===== */
  :root, [data-theme="indigo"] {
    --bg: #f5f6fb; --paper: #ffffff; --ink: #191a2e; --muted: #6b6d85; --line: #e6e7f2;
    --a1: #6d5dfc; --a2: #c04bff; --soft: #eeebff; --on-accent: #fff;
  }
  [data-theme="mata"] {
    --bg: #f1faf6; --paper: #ffffff; --ink: #11302a; --muted: #5a776f; --line: #dcefe7;
    --a1: #0e9f7e; --a2: #2dc6d4; --soft: #daf5ec; --on-accent: #fff;
  }
  [data-theme="koral"] {
    --bg: #fff6f1; --paper: #ffffff; --ink: #34160f; --muted: #86645a; --line: #f5e2d9;
    --a1: #f2545b; --a2: #ff9e3d; --soft: #ffe6dc; --on-accent: #fff;
  }
  [data-theme="ocean"] {
    --bg: #f0f5fd; --paper: #ffffff; --ink: #0f213d; --muted: #5a6b85; --line: #dde7f5;
    --a1: #1f63e8; --a2: #1fb5e0; --soft: #dfeafc; --on-accent: #fff;
  }
  [data-theme="noc"] {
    --bg: #0e0f1f; --paper: #181a2f; --ink: #eceaff; --muted: #9c9bc0; --line: #2a2c48;
    --a1: #8b7bff; --a2: #f062b0; --soft: #262448; --on-accent: #fff;
  }
  [data-theme="les"] {
    --bg: #0f1a16; --paper: #16241f; --ink: #e5f3ec; --muted: #93b3a5; --line: #243a32;
    --a1: #3ecf8e; --a2: #c8e64a; --soft: #1f3a30; --on-accent: #0b1a14;
  }
  :root { --grad: linear-gradient(135deg, var(--a1), var(--a2)); --radius: 18px; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 "Plus Jakarta Sans", system-ui, sans-serif;
    transition: background .3s, color .3s;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -30vh -10vw auto; height: 70vh; z-index: -1;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--a1) 22%, transparent), transparent),
                radial-gradient(closest-side at 80% 40%, color-mix(in srgb, var(--a2) 18%, transparent), transparent);
    pointer-events: none;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)); }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ===== Horní lišta ===== */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; gap: 12px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; text-decoration: none; }
  .logo i { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; font-style: normal; font-size: 1.1rem; }
  .themes { display: flex; align-items: center; gap: 6px; }
  .themes span { font-size: .8rem; color: var(--muted); margin-right: 4px; }
  .dot {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--paper); cursor: pointer;
    box-shadow: 0 0 0 1px var(--line); padding: 0;
  }
  .dot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

  /* ===== Úvod ===== */
  .hero { text-align: center; padding: 30px 0 28px; }
  .hero h1 { font-size: clamp(2.1rem, 7vw, 4rem); line-height: 1.05; margin: 0; letter-spacing: -.035em; font-weight: 800; }
  .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); margin: 14px auto 0; max-width: 520px; font-size: 1.05rem; }
  /* hlavní vyhledávání podle názvu knihy nebo autora */
  .omni { position: relative; max-width: 640px; margin: 22px auto 0; text-align: left; }
  .omni input {
    font-size: 1.05rem; padding: 16px 18px 16px 50px; border-radius: 16px; background: var(--paper);
    border: 2px solid var(--line); box-shadow: 0 10px 30px -14px color-mix(in srgb, var(--a1) 45%, transparent);
  }
  .omni input:focus { outline: none; border-color: var(--a1); }
  .omni .ico { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 1.15rem; pointer-events: none; }
  .omni-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; max-height: min(70vh, 520px); overflow-y: auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 50px -15px rgba(0,0,0,.45); padding: 6px;
  }
  .omni-list .head { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
  .orow {
    display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; width: 100%; padding: 8px 10px;
    border: none; background: none; border-radius: 10px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  }
  .orow:hover, .orow.active { background: var(--soft); }
  .orow .mini { width: 40px; height: 58px; border-radius: 6px; overflow: hidden; position: relative; background: var(--soft); }
  .orow .mini .ph { padding: 4px; font-size: .5rem; }
  .orow .mini img { width: 100%; height: 100%; object-fit: cover; }
  .orow .av { width: 40px; height: 40px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .85rem; overflow: hidden; }
  .orow .av img { width: 100%; height: 100%; object-fit: cover; }
  .orow b { display: block; line-height: 1.25; }
  .orow small { color: var(--muted); }
  .omni-all { width: 100%; margin-top: 4px; justify-content: center; }
  .omni-note { padding: 14px; color: var(--muted); font-size: .9rem; }

  /* ===== Vyhledávací panel ===== */
  .panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 22px;
    box-shadow: 0 10px 40px -12px color-mix(in srgb, var(--a1) 25%, transparent);
  }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 20px; }
  .seg button { border: none; background: none; padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--grad); color: var(--on-accent); }
  .label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; display: block; }
  .genres { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font-size: .9rem; font-weight: 500; cursor: pointer;
    transition: transform .12s, border-color .15s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--a1); }
  .chip[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: var(--on-accent); font-weight: 600; }

  .row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 14px; }
  .mode-author .row { grid-template-columns: 2fr 1fr; }
  .mode-author .sort-field, .mode-author .period-field, .mode-author .genre-block, .mode-genre .author-only { display: none; }
  .grid-hint { margin: -4px 0 18px; }
  .mode-genre .mood-only, .mode-author .mood-only, .mode-mood .genre-block { display: none; }
  .mood-examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .mood-examples .chip { font-size: .85rem; }
  .mood-parse { margin-top: 14px; font-size: .88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag.yes { background: var(--grad); color: var(--on-accent); }
  .tag.no { text-decoration: line-through; opacity: .8; }
  .seg .s { display: none; }

  /* ===== Překvap mě – jedna kniha ===== */
  #lucky, #welcome {
    border: none; padding: 0; border-radius: 26px; background: var(--paper); color: var(--ink);
    width: min(680px, calc(100% - 32px)); max-height: calc(100% - 32px);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.5);
  }
  #lucky[open], #welcome[open] { animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.9) translateY(20px); } }
  #lucky::backdrop, #welcome::backdrop { background: rgba(10, 8, 25, .6); backdrop-filter: blur(4px); }
  .lucky { display: grid; grid-template-columns: 200px 1fr; gap: 26px; padding: 26px; position: relative; }
  .lucky .cover { box-shadow: 0 20px 40px -16px rgba(0,0,0,.5); }
  .lucky .badge { display: inline-block; background: var(--grad); color: var(--on-accent); font-weight: 700; font-size: .78rem; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
  .lucky h2 { margin: 0; font-size: 1.6rem; line-height: 1.15; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .lucky .meta { color: var(--muted); margin: 6px 0 12px; }
  .lucky .ldesc { font-size: .93rem; margin: 0; color: var(--ink); }
  .lucky .actions { margin-top: 18px; }
  .lucky .x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--soft); cursor: pointer; font-size: 1.1rem; z-index: 2; }
  .lucky.loading { min-height: 320px; place-items: center; grid-template-columns: 1fr; text-align: center; color: var(--muted); }
  .spin { font-size: 2.6rem; display: inline-block; animation: roll .8s linear infinite; }
  @keyframes roll { to { transform: rotate(360deg); } }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 16px; /* 16px = mobil nepřibližuje */
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--a1); outline-offset: 1px; }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    font-weight: 700; border: none; border-radius: 12px; padding: 12px 20px; cursor: pointer; min-height: 46px;
    background: var(--grad); color: var(--on-accent); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .12s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px var(--a1); }
  .btn.ghost { background: var(--soft); color: var(--ink); }
  .btn.ghost.on { outline: 2px solid var(--a1); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

  /* ===== Uvítání ===== */
  .wel { padding: 26px; display: grid; gap: 14px; }
  .wel h2 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; }
  .wel p { margin: 0; color: var(--muted); }
  .wdots { display: flex; gap: 6px; }
  .wdots i { width: 28px; height: 5px; border-radius: 3px; background: var(--soft); }
  .wdots i.on { background: var(--grad); }
  .wel .genres { margin: 0; max-height: 40vh; overflow-y: auto; flex-wrap: wrap; }
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; max-height: 46vh; overflow-y: auto; padding: 4px; }
  .wpick { position: relative; border: none; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .wpick small { display: block; font-size: .72rem; line-height: 1.2; margin-top: 4px; color: var(--muted); }
  .wpick.on .cover { outline: 3px solid var(--a1); outline-offset: 2px; }
  .wpick .heart { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; display: none; place-items: center; background: var(--grad); color: #fff; font-size: .8rem; z-index: 1; }
  .wpick.on .heart { display: grid; }
  .wel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .wel li { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .wel .actions { margin-top: 4px; justify-content: space-between; }
  /* ===== Další filtry, patička, stránka O aplikaci ===== */
  .filters2 { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; }
  .filters2 .check { margin-top: 0; }
  .foot { text-align: center; color: var(--muted); font-size: .88rem; padding: 0 0 calc(40px + env(safe-area-inset-bottom)); line-height: 2; }
  .foot a { color: var(--a1); font-weight: 600; }
  .about h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); margin: 0 0 6px; }
  .about .section h2 { justify-content: flex-start; }
  .about .section p, .about .section li { font-size: .95rem; }
  .about .section ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .about a { color: var(--a1); }
  .fb { display: grid; gap: 12px; max-width: 560px; }
  .fb label { font-size: .85rem; font-weight: 600; display: grid; gap: 6px; }

  /* ===== Čtenářský deník ===== */
  .diary { display: grid; gap: 20px; }
  .diary h2 { font-size: 1.15rem; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .dtile { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .dtile b { display: block; font-size: 1.7rem; line-height: 1.1; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .dtile span { color: var(--muted); font-size: .85rem; }
  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; height: 120px; margin-top: 18px; }
  .months div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: .7rem; color: var(--muted); }
  .months i { display: block; width: 100%; max-width: 34px; background: var(--grad); border-radius: 6px 6px 2px 2px; min-height: 3px; }
  .months i.zero { background: var(--soft); }
  .goal { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-size: .92rem; }
  .goal input { width: 84px; padding: 9px 10px; }
  .years { display: flex; gap: 6px; flex-wrap: wrap; }
  .years .chip { padding: 5px 12px; font-size: .85rem; }
  .cap { font-size: .76rem; color: var(--muted); margin-top: 4px; line-height: 1.3; }
  .card .mini-btn { margin-top: 8px; width: 100%; min-height: 36px; padding: 6px 8px; font-size: .82rem; }
  .date-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: .9rem; flex-wrap: wrap; }
  .date-row input { width: auto; padding: 7px 10px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: .92rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100% - 32px); text-align: center; animation: slide .2s ease-out;
  }
  .home-strip .strip { grid-auto-columns: 140px; }
  .chip.new { border-color: var(--a1); font-weight: 700; }
  @media (max-width: 560px) { .months { height: 90px; gap: 3px; } .home-strip .strip { grid-auto-columns: 120px; margin: 0 -16px; padding: 4px 16px 10px; } }

  /* ===== Narozeniny spisovatelů ===== */
  .bday { margin-top: 30px; }
  .bday-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .bday-head h2 { margin: 0; font-size: 1.25rem; letter-spacing: -.01em; }
  .bday-head span { color: var(--muted); font-size: .85rem; }
  .bday-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 14px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; }
  .bcard {
    scroll-snap-align: start; background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 12px; text-align: center; cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .15s, border-color .15s;
  }
  .bcard:hover { border-color: var(--a1); transform: translateY(-2px); }
  .bphoto {
    width: 84px; height: 84px; border-radius: 50%; overflow: hidden; background: var(--grad); flex-shrink: 0;
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.5rem; margin-bottom: 8px;
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--a1);
  }
  .bphoto img { width: 100%; height: 100%; object-fit: cover; }
  .bcard b { font-size: .92rem; line-height: 1.25; }
  .bcard small { color: var(--muted); font-size: .78rem; line-height: 1.3; }
  .bage { font-size: .74rem; font-weight: 700; background: var(--soft); border-radius: 999px; padding: 3px 10px; margin-top: auto; }
  .bage.round { background: var(--grad); color: var(--on-accent); }
  @media (max-width: 560px) { .bday-strip { grid-auto-columns: 132px; margin: 0 -16px; padding: 4px 16px 10px; } }

  /* ===== Autor ===== */
  .author-box {
    display: grid; grid-template-columns: 110px 1fr; gap: 22px; align-items: start;
    background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 20px; margin-top: 28px;
  }
  .author-box[hidden] { display: none; }
  .avatar { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; background: var(--grad); display: grid; place-items: center; font-size: 2.4rem; color: #fff; font-weight: 800; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .author-box h2 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; }
  .author-box .sub { color: var(--muted); margin: 2px 0 10px; }
  .bio { margin: 0; font-size: .95rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .bio.open { -webkit-line-clamp: unset; }
  .others { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-size: .85rem; color: var(--muted); align-items: center; }
  .hint { background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: .88rem; margin-top: 12px; }
  .linkbtn { background: none; border: none; color: var(--a1); font-weight: 600; font-size: .85rem; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

  /* ===== Záložky a mřížka ===== */
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 16px; gap: 12px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); padding: 4px; border-radius: 14px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { background: none; border: none; cursor: pointer; color: var(--muted); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--soft); color: var(--ink); }
  .status { color: var(--muted); margin: 0; font-size: .92rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 26px 20px; }
  .card { cursor: pointer; border-radius: var(--radius); outline: none; min-width: 0; }
  .card .cover { transition: transform .2s, box-shadow .2s; }
  @media (hover: hover) {
    .card:hover .cover { transform: translateY(-5px) rotate(-.6deg); box-shadow: 0 18px 30px -12px color-mix(in srgb, var(--a1) 55%, transparent); }
  }
  .card:focus-visible .cover { outline: 3px solid var(--a1); }
  .cover {
    aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; position: relative;
    box-shadow: 0 4px 14px -6px rgba(0,0,0,.25); background: var(--soft);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; color: #fff; font-weight: 700; line-height: 1.2; overflow: hidden; }

<script>
// ===================== Nastavení =====================
// [emoji, název, id] – id je zároveň téma v Open Library (pokud v OL_SUBJECT není jinak)
const GENRES = [
  ["🐉", "Fantasy", "fantasy"], ["🌹", "Romantasy", "romantasy"], ["🖤", "Dark romance", "dark_romance"],
  ["🚀", "Sci-fi", "science_fiction"], ["🔎", "Detektivka", "detective_and_mystery_stories"], ["☕", "Pohodová detektivka", "cozy_mystery"],
  ["🔪", "Thriller", "thrillers"], ["🧩", "Psychologický thriller", "psychological_thrillers"], ["💘", "Romantika", "romance"],
  ["🏒", "Sportovní romance", "sports_romance"], ["💐", "Romány pro ženy", "women"], ["🏡", "Rodinné ságy", "family_saga"],
  ["💞", "New adult", "new_adult"], ["👻", "Horor", "horror"], ["🏰", "Historický román", "historical_fiction"],
  ["🧭", "Dobrodružství", "adventure_stories"], ["😂", "Humor", "humor"], ["🎩", "Klasika", "classic_literature"],
  ["🍥", "Manga", "manga"], ["💥", "Komiksy", "comics"], ["🧸", "Pro děti", "juvenile_fiction"],
  ["🎧", "Pro mládež", "young_adult_fiction"], ["🧚", "Pohádky", "fairy_tales"], ["⚔️", "Válečné", "war_stories"],
  ["🪶", "Poezie", "poetry"], ["🕵️", "True crime", "true_crime"], ["👤", "Životopisy", "biography"],
  ["📜", "Historie", "history"], ["🌱", "Seberozvoj", "self_help"], ["🧠", "Psychologie", "psychology"],
  ["💭", "Filozofie", "philosophy"],
];
// téma v Open Library, kde se liší od id (null = Open Library ho nezná, hledá se jen v ostatních zdrojích)
const OL_SUBJECT = {
  romantasy: "fantasy romance", dark_romance: "dark romance", cozy_mystery: "cozy mystery",
  psychological_thrillers: "psychological thrillers", sports_romance: "sports romance", women: null,
  family_saga: "family saga", new_adult: "new adult fiction", true_crime: "true crime", self_help: "self-help techniques",
};
const olSubject = (g) => (g in OL_SUBJECT ? OL_SUBJECT[g] : g.replace(/_/g, " "));

// Jazykové kódy MARC (používá je Open Library)
const LANGS = [
  ["cze", "čeština", "v češtině"], ["slo", "slovenština", "ve slovenštině"], ["", "jakýkoliv jazyk", ""],
  ["eng", "angličtina", "v angličtině"], ["ger", "němčina", "v němčině"], ["pol", "polština", "v polštině"],
  ["fre", "francouzština", "ve francouzštině"], ["spa", "španělština", "ve španělštině"],
  ["ita", "italština", "v italštině"], ["rus", "ruština", "v ruštině"],
];
const langIn = (code) => LANGS.find((l) => l[0] === code)?.[2] || "";

// Období podle roku prvního vydání
const YEAR = new Date().getFullYear();
const PERIODS = [
  ["new",  "Novinky (5 let)", [YEAR - 4, YEAR + 1]],
  ["2010", "2010 – " + (YEAR - 5),         [2010, YEAR - 5]],
  ["2000", "2000 – 2009",                  [2000, 2009]],
  ["1950", "1950 – 1999",                  [1950, 1999]],
  ["1900", "1900 – 1949",                  [1900, 1949]],
  ["old",  "Starší než 1900",              ["*", 1899]],
  ["",     "Kdykoliv",                     null],

const plain = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

function parseMood(text) {
  const t = " " + plain(text) + " ";
  const m = { include: [], exclude: [], labels: [], pages: null, period: null, lang: null, rest: "" };
  let left = t;
  for (const [re, subject, label] of MOODS) {
    const hit = left.match(re);
    if (!hit) continue;
    // „ne horor“, „bez romantiky“, „nechci nic smutného“ → vyloučit
    const before = left.slice(Math.max(0, hit.index - 16), hit.index);
    const neg = /(^|\s)(ne|bez|zadn\w*|nechci|ani|krome)\s+(\S+\s+)?\S*$/.test(before);
    const list = neg ? m.exclude : m.include;
    if (!list.includes(subject)) { list.push(subject); m.labels.push({ label, neg }); }
    left = left.replace(new RegExp("\\S*" + hit[0] + "\\S*"), " ");
  }
  if (/kratk|kratsi|na jeden vecer|jednohubk/.test(t)) { m.pages = [0, 250]; m.labels.push({ label: "krátká (do 250 stran)" }); }
  else if (/dlouh|tlust|obsahl|epick/.test(t)) { m.pages = [500, "*"]; m.labels.push({ label: "dlouhá (přes 500 stran)" }); }
  if (/(^|\s)(novink|nov[aeyou]\s|nejnovejs|letosn|cerstv|soucasn)/.test(t)) { m.period = "new"; m.labels.push({ label: "novinky" }); }
  if (/cesk|v cestine/.test(t)) { m.lang = "cze"; m.labels.push({ label: "v češtině" }); }
  else if (/anglick|v anglictine/.test(t)) { m.lang = "eng"; m.labels.push({ label: "v angličtině" }); }
  const STOP = /^(neco|nejak\w*|kniha|knihu|knihy|chci|chtel\w*|bych|mam|chut|na|ale|a|s|se|pro|od|do|ktery|ktera|ktere|precist|cist|dobr\w*|hezk\w*|nic|moc|hodne|trochu|nebo|kratk\w*|dlouh\w*|nov\w*|novink\w*|ceske|cesk\w*|pribeh|roman)$/;
  m.rest = left.split(/[\s,.;!?]+/).filter((w) => w.length > 2 && !STOP.test(w)).join(" ");
  return m;
}

function moodQuery(m) {
  const parts = m.include.filter(olSubject).map((s) => `subject:(${olSubject(s)})`)
    .concat(m.exclude.filter(olSubject).map((s) => `-subject:(${olSubject(s)})`));
  if (m.pages) parts.push(`number_of_pages_median:[${m.pages[0]} TO ${m.pages[1]}]`);
  if (!m.include.length) parts.unshift(m.rest || "subject:fiction"); // samotné „ne …“ potřebuje něco kladného
  return parts.join(" ");
}

function showMoodParse(m) {
  const el = $("moodParse");
  el.hidden = false;
  el.innerHTML = m.labels.length
    ? `Rozumím: ${m.labels.map((l) => `<span class="tag ${l.neg ? "no" : l.neg === false ? "yes" : ""}">${l.neg ? "✗ bez: " : l.neg === false ? "✓ " : ""}${esc(l.label)}</span>`).join("")}`
    : `Nepoznala jsem žádný žánr, hledám podle slov „${esc(m.rest || $("q").value)}“.`;
}

function activeGenres() {
  if (state.mode === "mood") return { list: state.mood?.include || [], mode: "all" };
  return { list: state.genres, mode: state.genreMode };
}
// Open Library: „subject:(slova)“ hledá stejně jako parametr subject; null = Open Library tu kombinaci neumí
function olGenreQuery(list, mode) {
  const subjects = list.map(olSubject);
  if (mode === "all" && subjects.includes(null)) return null;
  const terms = subjects.filter(Boolean).map((x) => `subject:(${x})`);
  if (!terms.length) return list.length ? null : "";
  return mode === "all" ? terms.join(" ") : terms.length > 1 ? `(${terms.join(" OR ")})` : terms[0];
}

  const ed = doc.editions?.docs?.[0];
  const title = $("lang").value && ed?.title ? ed.title : doc.title;
  const book = {
    key: doc.key, title,
    original: title !== doc.title ? doc.title : null,
    author: (doc.author_name || []).slice(0, 2).join(", "),
    authorKeys: (doc.author_key || []).slice(0, 2),
    year: doc.first_publish_year,
    cover: ed?.cover_i || doc.cover_i || null,
    rating: doc.ratings_average, ratings: doc.ratings_count,
    editions: doc.edition_count, pages: doc.number_of_pages_median,
    ebook: doc.ebook_access, ia: doc.ia?.[0],
    ebookAvail: ["public", "borrowable"].includes(doc.ebook_access),
  };
  cache.set(book.key, book);
  return book;
}

async function search({ append = false, random = false } = {}) {
  if (state.mode === "author" && !state.author) return findAuthor();
  const text = $("q").value.trim();
  if (state.mode === "genre" && !state.genres.length && !text && !$("period").value && $("sort").value !== "rating") {
    $("status").textContent = "";
    $("grid").innerHTML = `<div class="empty"><b>👆</b>Vyber žánr nebo napiš téma a najdeme ti knihy.</div>`;
    return;
  }
  if (state.mode === "mood" && !append) {
    if (!text) {
      $("grid").innerHTML = `<div class="empty"><b>💬</b>Popiš vlastními slovy, na co máš chuť – třeba „něco napínavého, ale ne horor“.</div>`;
      return;
    }
    state.mood = parseMood(text);
    if (state.mood.period) $("period").value = state.mood.period;
    if (state.mood.lang) $("lang").value = state.mood.lang;
    showMoodParse(state.mood);
  }
  state.searched = true;
  if (!append) {
    state.page = 1; state.books = []; state.seen = new Map();
    state.olMore = state.gbMore = state.kcMore = true; state.olTotal = state.gbCount = state.kcTotal = 0;
  }
  showView("results");

  const p = new URLSearchParams({ limit: LIMIT, page: state.page, fields: FIELDS });
  const lang = $("lang").value;
  let q = "";
  if (state.mode === "author") {
    p.set("author_key", state.author.key);
    p.set("sort", "new");
  } else {
    const sort = random ? "random_" + Date.now() : $("sort").value;
    if (sort) p.set("sort", sort);
    const genreQ = state.mode === "genre" ? olGenreQuery(state.genres, state.genreMode) : "";
    if (genreQ === null) state.olMore = false; // vybrané žánry Open Library nezná
    q = [
      genreQ,
      state.mode === "mood" ? moodQuery(state.mood) : text,
      periodQuery($("period").value),
      // u žebříčku jen knihy s dostatkem hodnocení, ať nevyhraje kniha s jediným hlasem
      sort === "rating" ? `ratings_count:[${lang ? 8 : 40} TO *]` : "",
    ].filter(Boolean).join(" ");
  }
  if (fmt() === "ebook") q = [q, "ebook_access:[borrowable TO *]"].filter(Boolean).join(" ");
  if (state.mode !== "mood" && lengthRange()) q = [q, `number_of_pages_median:[${lengthRange()[0]} TO ${lengthRange()[1]}]`].filter(Boolean).join(" ");
  if (fmt() === "audio") state.olMore = false; // Open Library audioknihy nemá
  if (q) p.set("q", q);
  if (lang) p.set("language", lang);

  state.controller?.abort();
  state.controller = new AbortController();
  const signal = state.controller.signal;
  $("status").textContent = "Hledám knihy…";
  $("more").hidden = true;
  if (!append) $("grid").innerHTML = skeletons(state.mode === "author" ? 8 : 12);

  // všechny tři databáze najednou; když některá selže, ukážeme aspoň ostatní
  const olSkip = !state.olMore || (state.mode === "author" && !state.author.key) || (!q && !p.has("author_key"));
  const none = { books: [], more: false, total: 0 };
  const [ol, gb, kc] = await Promise.allSettled([
    olSkip ? Promise.resolve(null) : fetch(`${API}/search.json?${p}`, { signal }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    state.gbMore ? fetchGB(state.page, signal) : Promise.resolve(none),
    state.kcMore ? fetchKC(state.page, signal) : Promise.resolve(none),
  ]);
  if (signal.aborted) return;
  if (ol.status === "rejected" && gb.status === "rejected" && kc.status === "rejected") {
    $("status").textContent = "";
    $("grid").innerHTML = `<div class="empty"><b>😕</b>Nepodařilo se načíst knihy. Zkontroluj připojení a zkus to znovu.</div>`;
    return;
  }
  let olBooks = [];
  if (ol.status === "fulfilled" && ol.value) {
    olBooks = ol.value.docs.map(toBook);
    state.olTotal = ol.value.numFound;
    state.olMore = state.page * LIMIT < ol.value.numFound;
  } else state.olMore = false;
  const gbBooks = gb.status === "fulfilled" ? gb.value.books : [];
  state.gbMore = gb.status === "fulfilled" && gb.value.more;

  const kcBooks = kc.status === "fulfilled" ? kc.value.books : [];
  state.kcMore = kc.status === "fulfilled" && kc.value.more;
  if (state.page === 1 && kc.status === "fulfilled") state.kcTotal = kc.value.total;

  const merged = mergeBooks(olBooks, gbBooks, kcBooks);
  state.gbCount += merged.gbAdded;
  state.total = state.olTotal + state.gbCount + state.kcTotal;
  state.books.push(...merged.books);
  render();
}

// ===================== Google Books =====================
// vrací seznam dotazů – u „kterýkoli z žánrů“ jeden dotaz na každý žánr
function gbSpecs() {
  if (!GOOGLE_BOOKS_KEY || fmt() === "audio") return [];
  if (state.mode === "author") return state.author?.name ? [{ q: `inauthor:"${state.author.name}"`, cat: null }] : [];
  if ($("sort").value === "rating") return []; // žebříček jen z Open Library, Google Books má málo hodnocení
  const lang = $("lang").value;
  const czech = lang === "cze" || lang === "slo";
  const text = activeText();
  let { list, mode } = activeGenres();
  if (czech) list = list.filter((g) => GB_GENRES[g]);
  if (mode === "all" && list.length > 1) list = list.slice(0, 1); // Google Books neumí „všechny najednou“ – vezmeme první
  const specs = list.map((g) => czech
    ? { q: [text, GB_GENRES[g][0]].filter(Boolean).join(" "), cat: GB_GENRES[g][1] }
    : { q: [text, "subject:" + (olSubject(g) || g.replace(/_/g, " "))].filter(Boolean).join(" "), cat: null });
  if (!specs.length && text) specs.push({ q: text, cat: null });
  if (!specs.length && activeGenres().list.length === 0 && !text) return [];
  return specs.slice(0, 4);
}

async function fetchGB(page, signal) {
  const specs = gbSpecs();
  if (!specs.length) return { books: [], more: false };
  if (page === 1) state.gbStarts = specs.map(() => 0);
  const lang = GB_LANG[$("lang").value];
  const range = state.mode !== "author" ? PERIODS.find((x) => x[0] === $("period").value)?.[2] : null;
  const ebooks = fmt() === "ebook";
  const newest = state.mode === "author" || $("sort").value === "new" || $("period").value === "new";
  // u jednoho dotazu dotáhneme až 3 várky (po odfiltrování často zbude málo), u více dotazů po jedné
  const rounds = specs.length === 1 ? 3 : 1;
  let more = false;
  const results = await Promise.all(specs.map(async (spec, si) => {
    const p = new URLSearchParams({ q: spec.q, maxResults: GB_PAGE, printType: "books", key: GOOGLE_BOOKS_KEY });
    if (lang) p.set("langRestrict", lang);
    if (newest) p.set("orderBy", "newest");
    if (ebooks) p.set("filter", "ebooks");
    const out = [];
    let has = true;
    for (let i = 0; i < rounds && has && out.length < 12; i++) {
      p.set("startIndex", state.gbStarts[si]);
      const r = await fetch(`${GB_API}?${p}`, { signal });
      if (!r.ok) throw new Error(r.status);
      const items = (await r.json()).items || [];
      state.gbStarts[si] += GB_PAGE;
      has = items.length === GB_PAGE;
      out.push(...filterGB(items, spec, lang, range).filter((b) => !moodExcluded(b)));
    }
    if (has) more = true;
    return out;
  }));
  // střídáme výsledky jednotlivých žánrů
  const books = [];
  for (let i = 0; i < Math.max(0, ...results.map((r) => r.length)); i++) results.forEach((r) => r[i] && books.push(r[i]));
  return { books, more };
}

function filterGB(items, spec, lang, range) {
  return items.filter((it) => {
    const v = it.volumeInfo;
    if (!v.title || !v.authors) return false;
    if (lang && v.language !== lang) return false;               // langRestrict není stoprocentní
    if (spec.cat && !spec.cat.test((v.categories || []).join(" "))) return false;
    if (range) {
      const y = parseInt(v.publishedDate);
      if (!y || y < (range[0] === "*" ? -Infinity : range[0]) || y > range[1]) return false;
    }
    if (!fitsLength({ pages: v.pageCount }, lengthRange())) return false;
    return true;
  }).map(toGBook);
}

function toGBook(item) {
  const v = item.volumeInfo;
  const img = v.imageLinks?.thumbnail || v.imageLinks?.smallThumbnail;
  const book = {
    key: "gb:" + item.id, gbId: item.id,
    title: v.title,
    author: (v.authors || []).slice(0, 2).join(", "),
    authorKeys: [],
    year: parseInt(v.publishedDate) || null,
    coverUrl: img ? img.replace(/^http:/, "https:").replace("&edge=curl", "") : null,
    rating: v.averageRating, ratings: v.ratingsCount, pages: v.pageCount,
    ebookAvail: !!(item.saleInfo?.isEbook || item.accessInfo?.epub?.isAvailable || item.accessInfo?.pdf?.isAvailable),
    tagsText: plain([v.title, (v.categories || []).join(" "), (v.description || "").slice(0, 400)].join(" ")),
  };
  cache.set(book.key, book);
  return book;
}

// ===================== Knihovny.cz =====================
function kcSpec(forLucky = false) {
  const lang = $("lang").value;
  if (lang && !KC_LANG[lang]) return null;
  if (state.mode === "author") return state.author?.name ? { lookfor: `"${state.author.name}"`, type: "Author", author: state.author.name } : null;
  if (!forLucky && $("sort").value === "rating") return null; // žebříček jen podle hodnocení z Open Library
  const { list, mode } = activeGenres();
  const text = activeText();
  const known = list.filter((g) => KC_GENRES[g]);
  if (mode === "all" && known.length < list.length) return null; // některý z žánrů katalog nezná
  const genreQ = known.length > 1
    ? known.map((g) => `(${KC_GENRES[g]})`).join(mode === "all" ? " AND " : " OR ")
    : known[0] ? KC_GENRES[known[0]] : "";
  if (text) return { lookfor: [text, genreQ && `(${genreQ})`].filter(Boolean).join(" "), type: "AllFields" };
  if (genreQ) return { lookfor: genreQ, type: "Subject" };
  if (state.mode === "mood" || list.length) return null;
  return { lookfor: "romány", type: "Subject" }; // úvodní stránka: nejnovější české romány
}

// knihy, e-knihy a audioknihy (ne hry, filmy, články…)
const KC_BOOKISH = ["0/BOOKS/", "0/EBOOK/", "0/AUDIO/", "0/EAUDIOBOOK/"];
function kcFormatFilter(p, f) {
  if (f === "ebook") p.append("filter[]", 'record_format_facet_mv:"0/EBOOK/"');
  else if (f === "audio") {
    p.append("filter[]", '~record_format_facet_mv:"0/AUDIO/"');
    p.append("filter[]", '~record_format_facet_mv:"0/EAUDIOBOOK/"');
  } else if (f === "print") p.append("filter[]", 'record_format_facet_mv:"0/BOOKS/"');
}

const kcParams = (params) => {
  const p = new URLSearchParams(params);
  KC_FIELDS.forEach((f) => p.append("field[]", f));
  return p;
};
const kcRecordUrl = (id) => `${KC_API}/record?${kcParams({ id })}`;

async function fetchKC(page, signal) {
  const spec = kcSpec();
  if (!spec) return { books: [], more: false, total: 0 };
  const p = kcParams({ lookfor: spec.lookfor, type: spec.type, limit: KC_PAGE, page });
  const lang = KC_LANG[$("lang").value];
  if (lang) p.append("filter[]", `language:"${lang}"`);
  const range = state.mode !== "author" ? PERIODS.find((x) => x[0] === $("period").value)?.[2] : null;
  if (range) p.append("filter[]", `publishDate:[${range[0]} TO ${range[1]}]`);
  kcFormatFilter(p, fmt()); // jen e-knihy / audioknihy už v katalogu
  if (state.mode === "author" || $("sort").value === "new" || $("period").value === "new") p.set("sort", "publishDateSort desc");
  const r = await fetch(`${KC_API}/search?${p}`, { signal });
  if (!r.ok) throw new Error(r.status);
  const data = await r.json();
  const recs = data.records || [];
  let books = recs.filter((x) => x.title && (x.formats || []).some((f) => KC_BOOKISH.includes(f)))
    .map(toKCBook).filter((b) => !moodExcluded(b) && (!spec.author || sameAuthor(b, spec.author)));
  books = books.filter((b) => fitsLength(b, lengthRange()));
  return { books, more: recs.length === KC_PAGE, total: data.resultCount || 0 };
}

function kcAuthor(r) {
  const names = Object.keys(r.authors?.primary || {});
  const list = names.length ? names : Object.keys(r.authors?.secondary || {});
  return list.slice(0, 2).map((n) => n.replace(/,\s*[\d\s?.–-]*$/, "").replace(/,\s*$/, "").trim()).join(", ");
}

function toKCBook(r) {
  const isbn = (Array.isArray(r.cleanIsbn) ? r.cleanIsbn[0] : r.cleanIsbn) || null;
  const book = {
    key: "kc:" + r.id, kcId: r.id,
    title: String(r.title).replace(/\s+:\s+/g, ": ").replace(/\s+\/\s+/g, " – ").replace(/\s*[\/;:.]\s*$/, "").trim(),
    author: kcAuthor(r),
    authorKeys: [],
    year: +(String(r.publicationDates?.[0] || "").match(/\d{4}/) || [])[0] || null,
    coverUrl: isbn ? `https://www.knihovny.cz/Cover/Show?isbn=${isbn}&size=medium` : null,
    pages: +(String(r.physicalDescriptions?.[0] || "").match(/(\d+)\s*stran/) || [])[1] || null,
    libs: (r.dedupIds || []).length || null, // kolik knihoven má tuhle knihu v katalogu
    ebookAvail: (r.formats || []).includes("0/EBOOK/"),
    audioAvail: (r.formats || []).some((f) => f === "0/AUDIO/" || f === "0/EAUDIOBOOK/"),
    tagsText: plain([r.title, kcSubjects(r).join(" "), (r.summary || []).join(" ").slice(0, 400)].join(" ")),
  };
  cache.set(book.key, book);
  return book;
}

// katalog u autora najde i jmenovce („Alena …“) – necháme jen knihy, kde sedí příjmení
function sameAuthor(book, name) {
  const surname = plain(name).split(/\s+/).pop();
  return plain(book.author || "").includes(surname);
}

function kcDesc(r) {
  const text = (r?.summary || []).join("\n\n").trim();
  return text.length >= 40 ? text : null;
}
const kcSubjects = (r) => [...new Set((r?.subjects || []).map((x) => x[0]).filter(Boolean))];

// stejná kniha z obou databází: název (bez závorky) + příjmení autora, bez diakritiky
function normKey(title, author) {
  const t = String(title || "").split("(")[0].replace(/&/g, " a "); // „Harry Potter & kámen mudrců“ = „… a kámen mudrců“
  const a = String(author || "").split(", ")[0].trim().split(/\s+/).pop() || "";
  return (t + a).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function mergeBooks(olBooks, gbBooks, kcBooks = []) {
  const seen = state.seen;
  const add = (list, enrich) => {
    const out = [];
    for (const b of list) {
      const k = normKey(b.title, b.author);
      const twin = seen.get(k);
      if (twin) { enrich?.(twin, b); continue; }
      seen.set(k, b);
      if (b.original) seen.set(normKey(b.original, b.author), b);
      out.push(b);
    }
    return out;
  };
  // stejná kniha z víc zdrojů – doplníme, co jí chybí (český popis, obálku)
  const olNew = add(olBooks);
  const kcNew = add(kcBooks, (twin, b) => {
    if (b.ebookAvail) { twin.ebookAvail = true; twin.kcEbookId = b.kcId; }
    if (b.audioAvail) { twin.audioAvail = true; twin.kcAudioId = b.kcId; }
    if (b.libs && !twin.libs) twin.libs = b.libs;
    if (!twin.kcId && !twin.key.startsWith("kc:")) twin.kcId = b.kcId;
    if (!twin.cover && !twin.coverUrl) twin.coverUrl = b.coverUrl;
  });
  const gbNew = add(gbBooks, (twin, b) => {
    if (b.ebookAvail) twin.ebookAvail = true;
    if (!twin.gbId && !twin.key.startsWith("gb:")) twin.gbId = b.gbId;
    if (!twin.cover && !twin.coverUrl) twin.coverUrl = b.coverUrl;
  });
  let books;
  if (state.mode === "author" || $("sort").value === "new") {
    books = [...olNew, ...kcNew, ...gbNew].sort((a, b) => (b.year || 0) - (a.year || 0));
  } else {
    books = [];  // střídáme, ať jsou vidět knihy ze všech zdrojů
    for (let i = 0; i < Math.max(olNew.length, kcNew.length, gbNew.length); i++) {
      if (olNew[i]) books.push(olNew[i]);
      if (kcNew[i]) books.push(kcNew[i]);
      if (gbNew[i]) books.push(gbNew[i]);
    }
  }
  return { books, gbAdded: gbNew.length };
}

// ===================== Autor =====================
async function findAuthor(replace = false) {
  const name = $("q").value.trim();
  if (!name) {
    $("grid").innerHTML = `<div class="empty"><b>✍️</b>Napiš jméno autora a ukážeme ti všechny jeho knihy.</div>`;
    return;
  }
  $("status").textContent = "Hledám autora…";
  $("grid").innerHTML = skeletons(8);
  try {
    const data = await (await fetch(`${API}/search/authors.json?q=${encodeURIComponent(name)}&limit=8`)).json();
    // nejdřív autoři s nejvíce díly – většinou je to ten hledaný
    const found = data.docs.filter((a) => a.work_count > 0).sort((a, b) => b.work_count - a.work_count);
    if (!found.length) return showNameAuthor(name); // Open Library ho nezná – najdeme ho v Google Books a českých knihovnách
    if (!found.length) {
      $("status").textContent = "";
      $("authorBox").hidden = true;
      $("grid").innerHTML = `<div class="empty"><b>🤷</b>Autora „${esc(name)}“ jsme nenašli. Zkus jiný zápis jména.</div>`;
      return;
    }
    state.authorAlternatives = found.slice(1, 5);
    if (replace) location.replace("#autor/" + found[0].key); else location.hash = "autor/" + found[0].key;
  } catch {
    $("status").textContent = "";
    $("grid").innerHTML = `<div class="empty"><b>😕</b>Nepodařilo se vyhledat autora.</div>`;
  }
}

// autor, kterého Open Library nezná (typicky noví čeští autoři) – knihy z Google Books a českých knihoven
function showNameAuthor(name) {
  setMode("author");
  state.author = { key: null, name };
  $("authorBox").hidden = false;
  $("authorBox").innerHTML = `
    <div class="avatar">${esc(initials(name))}</div>
    <div><h2>${esc(name)}</h2><p class="sub"><span id="aCount">…</span></p><span id="aFollowSlot"></span><div id="aHint"></div></div>`;
  mountAuthorFollow();
  search();
}

async function loadAuthor(id) {
  setMode("author");
  if (state.author?.key === id) return; // už je načtený (návrat ze stránky knihy)
  state.author = { key: id };
  const box = $("authorBox");
  box.hidden = false;
  box.innerHTML = `<div class="avatar">✍️</div><div><h2>Načítám autora…</h2></div>`;

  let a = null;
  try { a = await (await fetch(`${API}/authors/${id}.json`)).json(); } catch {}
  if (state.author?.key !== id) return;
  state.author.name = a?.name || a?.personal_name || $("q").value.trim() || null;
  search(); // jméno je potřeba pro hledání v Google Books

  try {
    if (!a) {
      box.innerHTML = `<div class="avatar">${esc(initials(state.author.name))}</div><div><h2>${esc(state.author.name || "Autor")}</h2><p class="sub"><span id="aCount">…</span></p><span id="aFollowSlot"></span><div id="aHint"></div></div>`;
      mountAuthorFollow();
      return;
    }
    if (!$("q").value) $("q").value = state.author.name;
    const years = [a.birth_date, a.death_date].filter(Boolean).join(" – ");
    const alts = (state.authorAlternatives || []).filter((x) => x.key !== id);
    box.innerHTML = `
      <div class="avatar" data-i="${esc(initials(state.author.name))}">
        <img alt="" src="https://covers.openlibrary.org/a/olid/${id}-M.jpg?default=false" onerror="this.parentNode.textContent = this.parentNode.dataset.i">
      </div>
      <div>
        <h2>${esc(state.author.name)}</h2>
        <p class="sub">${years ? esc(years) + " · " : ""}<span id="aCount">…</span></p>
        <span id="aFollowSlot"></span>
        <p class="bio" id="aBio"></p>
        <button class="linkbtn" id="aBioMore" hidden>Zobrazit celý životopis</button>
        <div id="aHint"></div>
        ${alts.length ? `<div class="others">Hledal/a jsi jiného autora? ${alts.map((x) => `<a class="linkbtn" href="#autor/${x.key}">${esc(x.name)}</a>`).join(" · ")}</div>` : ""}
      </div>`;
    mountAuthorFollow();
    updateAuthorInfo();
    const bio = typeof a.bio === "string" ? a.bio : a.bio?.value;
    if (bio) {
      const clean = cleanDesc(bio);
      $("aBio").textContent = clean;
      const tr = await translate(clean);
      if (tr && $("aBio")) $("aBio").textContent = tr;
      if ($("aBio") && $("aBio").scrollHeight > $("aBio").clientHeight + 4) {
        $("aBioMore").hidden = false;
        $("aBioMore").onclick = () => { $("aBio").classList.add("open"); $("aBioMore").hidden = true; };
      }
    }
  } catch {}
}

function updateAuthorInfo() {
  if (state.mode !== "author" || !$("aCount")) return;
  const lang = $("lang").value;
  $("aCount").textContent = `${state.total} ${plural(state.total, "kniha", "knihy", "knih")}` + (lang ? " " + langIn(lang) : "");
  $("aHint").innerHTML = lang
    ? `<div class="hint">Zobrazují se jen knihy, které vyšly <b>${langIn(lang)}</b>. <button class="linkbtn" id="allLangs">Zobrazit všechny jeho knihy</button></div>`
    : "";
  $("allLangs")?.addEventListener("click", () => { $("lang").value = ""; search(); });
}

// ===================== Vykreslení =====================
function render() {
  const grid = $("grid");
  grid.innerHTML = "";
  let books;
  const diary = state.view === "diary";
  $("diary").hidden = !diary;
  grid.hidden = diary;
  if (diary) {
    $("more").hidden = $("gridHint").hidden = true;
    $("status").textContent = "";
    return renderDiary();
  }

  if (state.view === "results") {
    books = state.books;
    $("status").textContent = state.total ? `Nalezeno ${state.total.toLocaleString("cs-CZ")} ${plural(state.total, "kniha", "knihy", "knih")}` : "";
    $("more").hidden = !(state.olMore || state.gbMore || state.kcMore);
    if (!state.books.length) {
      $("status").textContent = "";
      grid.innerHTML = `<div class="empty"><b>🔍</b>Nic jsme nenašli. Zkus jiný žánr, jazyk nebo období${fmt() ? ", nebo přepni formát na „Všechny knihy“" : ""}.</div>`;
    }
    updateAuthorInfo();
    // v češtině je nových knih v databázi málo – nabídneme novinky ze světa nebo starší knihy
    const lang = $("lang").value;
    const few = state.mode === "genre" && lang && $("period").value === "new" && state.total < LIMIT;
    $("gridHint").hidden = !few;
    if (few) {
      $("gridHint").innerHTML = `<div class="hint">Novinek <b>${langIn(lang)}</b> je zatím v databázi málo.
        <button class="linkbtn" id="hintAll">Ukázat novinky ze světa</button> nebo
        <button class="linkbtn" id="hintOld">starší knihy ${langIn(lang)}</button></div>`;
      $("hintAll").onclick = () => { $("lang").value = ""; search(); };
      $("hintOld").onclick = () => { $("period").value = ""; search(); };
    }
  } else {
    books = state.view === "rated"
      ? Object.values(myRatings).sort((a, b) => b.date - a.date).map((r) => r.book)
      : lists[state.view];
    $("more").hidden = true;
    $("gridHint").hidden = true;
    $("status").textContent = books.length ? `${books.length} ${plural(books.length, "kniha", "knihy", "knih")}` : "";
    if (!books.length) {
      const msg = state.view === "rated" ? "Zatím jsi nic nehodnotil/a. Otevři knihu, kterou jsi přečetl/a, a dej jí hvězdičky ⭐." : LISTS[state.view].empty;
      grid.innerHTML = `<div class="empty"><b>${state.view === "rated" ? "⭐" : LISTS[state.view].icon}</b>${msg}</div>`;
    }
  }
  books.forEach((book) => grid.appendChild(card(book)));
}

function coverHtml(book, size = "M") {
  if (book.cover) return `<img loading="lazy" alt="Obálka: ${esc(book.title)}" src="https://covers.openlibrary.org/b/id/${book.cover}-${size}.jpg">`;
  if (book.coverUrl) return `<img loading="lazy" alt="Obálka: ${esc(book.title)}" src="${esc(book.coverUrl)}" data-t="${esc(book.title)}" data-a="${esc(book.author || "")}" onload="fixCover(this)" onerror="fixCover(this, true)">`;
  return placeholderHtml(book.title, book.author);
}

// barevná náhradní obálka podle názvu
function placeholderHtml(title, author) {
  const h = [...String(title)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
  return `<div class="ph" style="background:linear-gradient(160deg,hsl(${h} 70% 55%),hsl(${(h + 50) % 360} 75% 38%))">${esc(title)}<small>${esc(author || "")}</small></div>`;
}

// knihovny vrací místo chybějící obálky malý obrázek 65×80 – nahradíme ho vlastní obálkou
function fixCover(img, failed = false) {
  if (!failed && img.naturalWidth > 70) return;
  const box = document.createElement("div");
  box.innerHTML = placeholderHtml(img.dataset.t || "", img.dataset.a);
  img.replaceWith(box.firstElementChild);
}

function card(book) {
  const el = document.createElement("div");
  el.className = "card";
  el.tabIndex = 0;
  el.setAttribute("role", "link");
  const mine = myRatings[book.key];
  el.innerHTML = `
    <div class="cover">${coverHtml(book)}
      <div class="quick">
        ${Object.entries(LISTS).filter(([, l]) => l.quick).map(([id, l]) =>
          `<button class="qbtn ${inList(id, book.key) ? "on" : ""}" data-list="${id}" aria-label="${l.add}" title="${l.add}">${l.icon}</button>`).join("")}
      </div>
      ${mine ? `<span class="mine">Tvoje ★ ${mine.stars}</span>` : ""}
      ${book.ebookAvail || book.audioAvail ? `<span class="ebadge" title="Existuje i jako ${[book.ebookAvail && "e-kniha", book.audioAvail && "audiokniha"].filter(Boolean).join(" a ")}">${[book.ebookAvail && "📱 e-kniha", book.audioAvail && "🎧 audio"].filter(Boolean).join(" · ")}</span>` : ""}
    </div>
    <h3>${esc(book.title)}</h3>
    <p class="author">${esc(book.author || "Neznámý autor")}</p>
    <div class="small">${book.year ? `<span>${book.year}</span>` : ""}${book.rating ? `<span><span class="star">★</span> ${book.rating.toFixed(1)}</span>` : ""}</div>`;
  el.querySelectorAll(".qbtn").forEach((btn) => (btn.onclick = (e) => {
    e.stopPropagation();
    toggleList(btn.dataset.list, book);
    btn.classList.toggle("on", inList(btn.dataset.list, book.key));
    if (state.view === btn.dataset.list) render();
  }));
  const open = () => { cache.set(book.key, book); state.fromApp = true; location.hash = bookHash(book); };
  el.onclick = open;
  el.onkeydown = (e) => { if (e.key === "Enter") open(); };
  return el;
}

function bookHash(book) {
  if (book.key.startsWith("gb:")) return "kniha/gb/" + book.gbId;
  if (book.key.startsWith("kc:")) return "kniha/kc/" + encodeURIComponent(book.kcId);
  return "kniha" + book.key.replace("/works", "");
}

function skeletons(n) {
  return Array.from({ length: n }, () => `<div class="card skeleton"><div class="cover"></div><div class="line"></div><div class="line"></div></div>`).join("");
}

// ===================== Stránka knihy =====================

    if (!book && vol) book = toGBook(vol);

              ${book.pages ? `<div class="fact"><b>${book.pages}</b>stran</div>` : ""}

      <div class="section">

  const syncLists = () => {

    $("bReadRow").hidden = !entry;
    if (entry) $("bReadDate").value = isoDate(entry.at);
  };

  listBtns.forEach((b) => (b.onclick = () => { toggleList(b.dataset.list, book); syncLists(); }));

  };

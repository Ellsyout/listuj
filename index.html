// odkaz na autora: podle klíče z Open Library, jinak podle jména
function authorHref(book, i) {
  const key = book.authorKeys?.[i];
  if (key) return "#autor/" + key;
  const name = (book.author || "").split(", ")[i];
  return "#autor-jmeno/" + encodeURIComponent(name || "");
}

function closeBook() {
  if ($("book").hidden) return;
  $("book").hidden = true;
  $("book").innerHTML = "";
  document.body.style.overflow = "";
  render(); // obnoví srdíčka, záložky a vlastní hodnocení na kartičkách
  renderRecent();
}

// ===================== Historie =====================
let historyData = store.get("historie", { books: [], queries: [] });
function rememberBook(book) {
  historyData.books = [slim(book), ...historyData.books.filter((b) => b.key !== book.key)].slice(0, 20);
  store.set("historie", historyData);
}
function rememberQuery(text) {
  if (!text) return;
  historyData.queries = [text, ...historyData.queries.filter((x) => plain(x) !== plain(text))].slice(0, 8);
  store.set("historie", historyData);
}
function renderRecent() {
  const box = $("recent");
  box.hidden = !historyData.books.length;
  if (box.hidden) return;
  box.innerHTML = `
    <div class="bday-head"><h2>🕘 Naposledy prohlížené</h2><span><button class="linkbtn" id="recentClear">smazat historii</button></span></div>
    <div class="strip" id="recentStrip"></div>`;
  historyData.books.forEach((b) => $("recentStrip").appendChild(card(b)));
  $("recentClear").onclick = () => { historyData = { books: [], queries: [] }; store.set("historie", historyData); renderRecent(); toast("Historie smazána"); };
}

function setupMyRating(book) {
  let stars = myRatings[book.key]?.stars || 0;
  $("bText").value = myRatings[book.key]?.text || "";
  const paint = (n) => $("bStars").querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.n <= n));
  paint(stars);
  $("bDel").hidden = !myRatings[book.key];
  $("bStars").querySelectorAll("button").forEach((b) => {
    b.onclick = () => { stars = +b.dataset.n; paint(stars); $("bSaved").textContent = ""; };
    b.onmouseenter = () => paint(+b.dataset.n);
    b.onmouseleave = () => paint(stars);
  });
  $("bSave").onclick = () => {
    if (!stars) { $("bSaved").textContent = "Vyber počet hvězdiček."; return; }
    myRatings[book.key] = { stars, text: $("bText").value.trim(), date: Date.now(), book: slim(book) };
    store.set("moje-hodnoceni", myRatings);
    $("bSaved").textContent = "✓ Uloženo";
    $("bDel").hidden = false;
    renderTabs();
  };
  $("bDel").onclick = () => {
    delete myRatings[book.key];
    store.set("moje-hodnoceni", myRatings);
    stars = 0; paint(0); $("bText").value = "";
    $("bSaved").textContent = "Smazáno";
    $("bDel").hidden = true;
    renderTabs();
  };
}

async function loadWorldRatings(book, vol) {
  if (book.key.startsWith("kc:")) {
    if ($("bWorld")) $("bWorld").textContent = "Pro tuto knihu zatím nemáme hodnocení ze světa. Mrkni na recenze českých čtenářů na Databázi knih.";
    return;
  }
  if (book.key.startsWith("gb:")) {
    const el = $("bWorld");
    const v = vol?.volumeInfo;
    if (!el) return;
    if (!v?.averageRating) { el.textContent = "Tuto knihu zatím nikdo neohodnotil."; return; }
    el.style.color = "";
    el.innerHTML = `
      <div style="display:flex;align-items:baseline;gap:10px">
        <span class="big">${v.averageRating.toFixed(1)}</span>
        <span><span class="star">${"★".repeat(Math.round(v.averageRating))}</span><br><small style="color:var(--muted)">${v.ratingsCount || 0} hodnocení</small></span>
      </div>
      <p class="note">Zdroj: Google Books</p>`;
    return;
  }
  try {
    const r = await (await fetch(`${API}${book.key}/ratings.json`)).json();
    const el = $("bWorld");
    if (!el) return;
    const count = r.summary?.count || 0;
    if (!count) { el.textContent = "Tuto knihu zatím nikdo neohodnotil."; return; }
    const max = Math.max(...Object.values(r.counts));
    el.style.color = "";
    el.innerHTML = `
      <div style="display:flex;align-items:baseline;gap:10px">
        <span class="big">${r.summary.average.toFixed(1)}</span>
        <span><span class="star">${"★".repeat(Math.round(r.summary.average))}</span><br><small style="color:var(--muted)">${count.toLocaleString("cs-CZ")} ${plural(count, "hodnocení", "hodnocení", "hodnocení")}</small></span>
      </div>
      <div class="dist">${[5, 4, 3, 2, 1].map((n) => `
        <div><span>${n} ★</span><i><b style="width:${(r.counts[n] || 0) / max * 100}%"></b></i><span>${r.counts[n] || 0}</span></div>`).join("")}
      </div>
      <p class="note">Zdroj: Open Library</p>`;
  } catch {
    if ($("bWorld")) $("bWorld").textContent = "Hodnocení se nepodařilo načíst.";
  }
}

async function loadDescription(book, vol, rec) {
  const info = {}; // podklady pro „Podobné knihy“
  try {
    let raw = null, tags = [];
    if (book.key.startsWith("gb:")) {
      raw = gbDesc(vol);
      tags = [...new Set((vol?.volumeInfo?.categories || []).map((c) => c.split(" / ").pop()))]; // „Fiction / Mystery / Cozy“ → „Cozy“
      info.cats = tags;
    } else if (book.key.startsWith("kc:")) {
      raw = kcDesc(rec);
      tags = info.kcSubjects = kcSubjects(rec);
    } else {
      const work = await (await fetch(`${API}${book.key}.json`)).json();
      raw = realDesc(work);
      tags = info.subjects = work.subjects || [];
      // český popis (z českých knihoven nebo z Google Books) má přednost před anglickým z Open Library
      let czech = false;
      if (book.kcId) {
        try {
          const k = kcDesc((await (await fetch(kcRecordUrl(book.kcId))).json()).records?.[0]);
          if (k) { raw = k; czech = true; }
        } catch {}
      }
      if (!czech && book.gbId && GOOGLE_BOOKS_KEY) {
        try {
          const v = await (await fetch(`${GB_API}/${book.gbId}?key=${GOOGLE_BOOKS_KEY}`)).json();
          const g = gbDesc(v);
          if (g && (v.volumeInfo.language === "cs" || !raw)) raw = g;
        } catch {}
      }
    }
    if (!$("bDesc")) return info;
    $("bTags").innerHTML = tags.slice(0, 8).map((s) => `<span class="tag">${esc(s)}</span>`).join("");
    const d = $("bDesc");
    if (!raw) { d.textContent = "K této knize zatím není popis."; return info; }
    const original = raw;
    d.textContent = "Překládám popis do češtiny…";
    const translated = await translate(original);
    if (!$("bDesc")) return info;
    d.style.color = "";
    if (!translated) { d.textContent = original; return info; }
    d.textContent = translated;
    if (translated !== original) {
      $("bNote").hidden = false;
      const t = $("bToggle");
      t.hidden = false;
      let showOrig = false;
      t.onclick = () => {
        showOrig = !showOrig;
        d.textContent = showOrig ? original : translated;
        t.textContent = showOrig ? "Zobrazit překlad" : "Zobrazit originál";
      };
    }
    return info;
  } catch {
    if ($("bDesc")) $("bDesc").textContent = "Popis se nepodařilo načíst.";
    return info;
  }
}

async function loadMoreByAuthor(book) {
  const akey = book.authorKeys?.[0];
  if (!akey) return book.key.startsWith("kc:") ? loadMoreByAuthorKC(book) : loadMoreByAuthorGB(book);
  const p = new URLSearchParams({ author_key: akey, limit: 12, sort: "readinglog", fields: FIELDS });
  if ($("lang").value) p.set("language", $("lang").value);
  try {
    const data = await (await fetch(`${API}/search.json?${p}`)).json();
    const books = data.docs.map(toBook).filter((b) => b.key !== book.key);
    if (!books.length || !$("bMore")) return;
    $("bMoreSec").hidden = false;
    books.forEach((b) => $("bMore").appendChild(card(b)));
  } catch {}
}

async function loadMoreByAuthorGB(book) {
  const name = (book.author || "").split(", ")[0];
  if (!name || !GOOGLE_BOOKS_KEY) return;
  const p = new URLSearchParams({ q: `inauthor:"${name}"`, maxResults: 20, printType: "books", key: GOOGLE_BOOKS_KEY });
  const lang = GB_LANG[$("lang").value];
  if (lang) p.set("langRestrict", lang);
  try {
    const items = (await (await fetch(`${GB_API}?${p}`)).json()).items || [];
    const seen = new Set([normKey(book.title, book.author)]);
    const books = items.filter((it) => it.volumeInfo.title && it.volumeInfo.authors).map(toGBook).filter((b) => {
      const k = normKey(b.title, b.author);
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    }).slice(0, 12);
    if (!books.length || !$("bMore")) return;
    $("bMoreSec").hidden = false;
    books.forEach((b) => $("bMore").appendChild(card(b)));
  } catch {}
}

function showStrip(secId, stripId, book, books) {
  const seen = new Set([normKey(book.title, book.author)]);
  const perAuthor = {};
  const varied = secId === "bSimSec"; // u podobných knih nejvýš 2 od jednoho autora, ať je výběr pestrý
  const unique = books.filter((b) => {
    const k = normKey(b.title, b.author);
    const a = (b.author || "").split(", ")[0];
    if (seen.has(k) || (varied && perAuthor[a] >= 2)) return false;
    seen.add(k);
    perAuthor[a] = (perAuthor[a] || 0) + 1;
    return true;
  }).slice(0, 12);
  if (!unique.length || !$(stripId)) return;
  $(secId).hidden = false;
  unique.forEach((b) => $(stripId).appendChild(card(b)));
}

async function kcSearch(lookfor, type, limit = 20, sort = "publishDateSort desc") {
  const p = kcParams({ lookfor, type, limit });
  if (sort) p.set("sort", sort);
  const lang = KC_LANG[$("lang").value];
  if (lang) p.append("filter[]", `language:"${lang}"`);
  const data = await (await fetch(`${KC_API}/search?${p}`)).json();
  return (data.records || []).filter((x) => x.title && (x.formats || []).includes("0/BOOKS/")).map(toKCBook);
}

async function loadMoreByAuthorKC(book) {
  const name = (book.author || "").split(", ")[0];
  if (!name) return;
  try { showStrip("bMoreSec", "bMore", book, (await kcSearch(`"${name}"`, "Author")).filter((b) => sameAuthor(b, name))); } catch {}
}

// Podobné knihy: podle témat knihy, ale od jiných autorů
const GENERIC_SUBJECT = /^(fiction|fiction, general|general|english literature|american literature|accessible book|protected daisy|in library|large type books|lending library|open library staff picks|nyt:|reading level|literature|juvenile literature|romance fiction)/i;
// příliš obecná témata a formáty („E-knihy“) – podle nich podobné knihy nehledáme
const GENERIC_KC = /^(české romány|romány|české prózy|prózy|beletrie|ženy|muži|česká literatura|e-knihy|elektronické knihy|audioknihy|zvukové knihy|mluvené slovo|publikace pro děti|knihy)$/i;

async function loadSimilar(book, info = {}) {
  showStrip("bSimSec", "bSim", book, await similarFromInfo(book, info));
}

// témata knihy (pro doporučení), když zrovna není otevřená její stránka
async function bookInfo(book) {
  try {
    if (book.key.startsWith("gb:")) {
      const v = await (await fetch(`${GB_API}/${book.gbId}?key=${GOOGLE_BOOKS_KEY}`)).json();
      return { cats: [...new Set((v.volumeInfo?.categories || []).map((c) => c.split(" / ").pop()))] };
    }
    if (book.key.startsWith("kc:")) return { kcSubjects: kcSubjects((await (await fetch(kcRecordUrl(book.kcId))).json()).records?.[0]) };
    return { subjects: (await (await fetch(`${API}${book.key}.json`)).json()).subjects || [] };
  } catch { return {}; }
}

async function similarFromInfo(book, info = {}) {
  const lang = $("lang").value;
  const firstAuthor = (book.author || "").split(", ")[0];
  const other = (b) => b.key !== book.key && (b.author || "").split(", ")[0] !== firstAuthor;
  let books = [];
  try {
    if (info.subjects?.length) {
      const subs = info.subjects.filter((x) => !GENERIC_SUBJECT.test(x) && !/[:(]/.test(x) && x.length < 40).slice(0, 3);
      for (let n = subs.length; n >= 1 && books.length < 4; n--) {  // čím víc společných témat, tím podobnější
        const p = new URLSearchParams({ q: subs.slice(0, n).map((x) => `subject:"${x}"`).join(" "), limit: 20, sort: "readinglog", fields: FIELDS });
        if (lang) p.set("language", lang);
        books = (await (await fetch(`${API}/search.json?${p}`)).json()).docs.map(toBook).filter(other);
      }
    } else if (info.kcSubjects?.length) {
      // žánrová témata („vědecko-fantastické romány“) mají přednost před národnostními („kanadské romány“)
      const national = /^\S+(ské|cké)\s+(romány|prózy|povídky|poezie)$/i;
      const subjects = info.kcSubjects.filter((x) => !GENERIC_KC.test(x) && !x.includes("("))
        .sort((a, b) => national.test(a) - national.test(b));
      for (const subject of subjects.slice(0, 3)) {
        books = (await kcSearch(subject, "Subject", 30)).filter(other);
        if (books.length >= 4) break;
      }
    } else if (info.cats?.length && GOOGLE_BOOKS_KEY) {
      const p = new URLSearchParams({ q: `subject:"${info.cats[0]}"`, maxResults: 20, printType: "books", key: GOOGLE_BOOKS_KEY });
      const gl = GB_LANG[lang];
      if (gl) p.set("langRestrict", gl);
      const items = (await (await fetch(`${GB_API}?${p}`)).json()).items || [];
      books = items.filter((it) => it.volumeInfo.title && it.volumeInfo.authors && (!gl || it.volumeInfo.language === gl)).map(toGBook).filter(other);
    }
  } catch {}
  return books;
}

// ===================== Série a navazující díly =====================
// 1) Wikidata (známé série s pořadím dílů), 2) jinak podle názvu („Krvavá říše. 5. díl“) v katalogu knihoven.
// Na stránce knihy je řada obálek s předchozím/dalším dílem, „Celá série“ otevře samostatnou stránku série.
const seriesCache = new Map();   // id série -> { id, name, author, parts }
const partCache = new Map();     // název dílu -> nalezená kniha
let readParts = new Set(store.get("prectene-dily", []));
const partKey = (x) => plain(x.title);

async function loadSeries(book) {
  let data = null;
  try { data = await seriesFromWikidata(book); } catch {}
  if (!data?.parts || data.parts.length < 2) { try { data = await seriesFromTitle(book); } catch {} }
  if (!data?.parts || data.parts.length < 2 || !$("bSeries")) return;
  data.author = data.author || (book.author || "").split(", ")[0];
  seriesCache.set(data.id, data);
  renderSeriesStrip(book, data);
}

function renderSeriesStrip(book, data) {
  data.parts.forEach((x) => { if (x.current && !x.book) x.book = book; }); // aktuální díl = otevřená kniha
  const parts = data.parts.filter((x) => x.num != null || x.current);
  const cur = parts.findIndex((x) => x.current);
  const prev = cur > 0 ? parts[cur - 1] : null;
  const next = cur >= 0 ? parts[cur + 1] : null;
  const box = $("bSeries");
  box.hidden = false;
  box.innerHTML = `
    <div class="series-head">
      <h2>📚 Série: ${esc(data.name)} <small>· ${parts.filter((x) => x.num != null).length} ${plural(parts.length, "díl", "díly", "dílů")}</small></h2>
      <a class="linkbtn" href="#serie/${encodeURIComponent(data.id)}" id="bSeriesAll">Celá série a moje čtení →</a>
    </div>
    <div class="series-strip">${parts.map((x) => `
      <button class="scard ${x.current ? "current" : ""}" data-i="${data.parts.indexOf(x)}" ${x.current ? 'aria-current="true"' : ""}>
        <div class="cover" id="sc-${data.parts.indexOf(x)}">${x.book ? coverHtml(x.book) : placeholderHtml(x.title, data.author)}</div>
        <span class="sbadge">${x.num != null ? esc(x.num) + ". díl" : "mimo pořadí"}${x.current ? " · tady jsi" : ""}</span>
        <b>${esc(x.title)}</b>
      </button>`).join("")}
    </div>
    <div class="snav">
      ${prev ? `<button class="btn ghost" data-i="${data.parts.indexOf(prev)}">← <span>${esc(prev.num)}. díl: ${esc(prev.title)}</span></button>` : "<span></span>"}
      ${next ? `<button class="btn" data-i="${data.parts.indexOf(next)}"><span>${esc(next.num)}. díl: ${esc(next.title)}</span> →</button>` : ""}
    </div>`;
  box.querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => openPart(data, data.parts[b.dataset.i])));
  $("bSeriesAll").onclick = () => { state.fromApp = true; };
  box.querySelector(".scard.current")?.scrollIntoView({ inline: "center", block: "nearest" });
  if (cur >= 0 && parts[cur].num != null) {
    $("bSeriesFact").hidden = false;
    $("bSeriesFact").innerHTML = `<b>${esc(parts[cur].num)}. díl</b>z ${parts.filter((x) => x.num != null).length}`;
  }
  // obálky ostatních dílů dohledáme na pozadí
  parts.forEach(async (x) => {
    if (x.book || x.current) return;
    const b = await resolvePart(x, data.author);
    const el = $("sc-" + data.parts.indexOf(x));
    if (b && el) el.innerHTML = coverHtml(b);
  });
}

function openPart(data, x) {
  if (x.current) return;
  state.fromApp = true;
  if (x.book) { cache.set(x.book.key, x.book); location.hash = bookHash(x.book); }
  else location.hash = "najit/" + encodeURIComponent(x.title) + "/" + encodeURIComponent(data.author || "");
}

// dohledá knihu k dílu z Wikidat: Open Library (česky, pak jakkoli) → katalog knihoven
async function resolvePart(x, author) {
  if (x.book) return x.book;
  const k = plain(x.title) + "|" + plain(author || "");
  if (partCache.has(k)) return (x.book = partCache.get(k));
  let book = null;
  try {
    const p = new URLSearchParams({ q: `title:(${x.title})${author ? ` author:(${author})` : ""}`, limit: 1, fields: FIELDS });
    if ($("lang").value) p.set("language", $("lang").value);
    let doc = (await (await fetch(`${API}/search.json?${p}`)).json()).docs?.[0];
    if (!doc && $("lang").value) { p.delete("language"); doc = (await (await fetch(`${API}/search.json?${p}`)).json()).docs?.[0]; }
    if (doc) book = toBook(doc);
    else book = (await kcSearch(x.title, "Title", 5)).find((b) => !author || sameAuthor(b, author)) || null;
  } catch {}
  partCache.set(k, book);
  return (x.book = book);
}

const WD_TYPES = "wd:Q7725634 wd:Q8261 wd:Q47461344 wd:Q1667921 wd:Q571";
const sparql = async (query) => (await (await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(query))).json()).results.bindings;
async function wdSearch(text, lang) {
  if (!text) return [];
  const u = `https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=5&language=${lang}&search=${encodeURIComponent(text)}`;
  return ((await (await fetch(u)).json()).search || []).map((x) => x.id);
}
async function seriesFromWikidata(book) {
  const ids = [...new Set([...(await wdSearch(book.original, "en")), ...(await wdSearch(book.title, "cs"))])];
  if (!ids.length) return null;
  // jen knihy – stejnojmenný film nebo videohra mají vlastní „série“
  const rows = await sparql(`SELECT ?book ?series WHERE {
    VALUES ?book { ${ids.map((x) => "wd:" + x).join(" ")} }
    VALUES ?type { ${WD_TYPES} } ?book wdt:P31 ?type; wdt:P179 ?series. }`);
  if (!rows.length) return null;
  // série té knihy, která se ve vyhledávání Wikidat objevila nejvýš
  const rank = (r) => ids.indexOf(r.book.value.split("/").pop());
  const best = rows.reduce((a, b) => (rank(b) < rank(a) ? b : a));
  return wdSeriesParts(best.series.value.split("/").pop(), best.book.value.split("/").pop());
}
async function wdSeriesParts(seriesQid, bookQid = null) {
  const rows = await sparql(`SELECT ?seriesLabel ?item ?itemLabel ?ord ?year WHERE {
    BIND(wd:${seriesQid} AS ?series)
    ?item wdt:P179 ?series.
    VALUES ?type { ${WD_TYPES} } ?item wdt:P31 ?type.
    OPTIONAL { ?item p:P179 ?st. ?st ps:P179 ?series. OPTIONAL { ?st pq:P1545 ?ord. } }
    OPTIONAL { ?item wdt:P577 ?d. BIND(YEAR(?d) AS ?year) }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "cs,mul,en". }
  } LIMIT 80`);
  if (!rows.length) return null;
  const items = new Map();
  for (const r of rows) {
    const label = r.itemLabel.value;
    if (/^Q\d+$/.test(label)) continue;
    const prev = items.get(r.item.value);
    const num = r.ord?.value && /^\d+$/.test(r.ord.value) ? r.ord.value : null; // jen celá čísla; „0.5“ = prequel
    if (!prev || (num && !prev.num)) items.set(r.item.value, { title: label, num, year: +r.year?.value || prev?.year || null, qid: r.item.value.split("/").pop() });
  }
  const parts = [...items.values()];
  parts.forEach((x) => { x.current = x.qid === bookQid; });
  // díly se stejným pořadím (např. cizojazyčná vydání) necháme jen jednou
  const seenNum = new Set();
  const clean = parts.sort(seriesOrder).filter((x) => x.num == null || x.current || (!seenNum.has(x.num) && seenNum.add(x.num)));
  let name = rows[0].seriesLabel?.value || "";
  if (!name || /^Q\d+$/.test(name)) {
    const titles = clean.filter((x) => x.num != null).map((x) => x.title);
    name = titles.reduce((a, t) => { let i = 0; while (i < a.length && a[i] === t[i]) i++; return a.slice(0, i); }, titles[0] || "").replace(/[\s:.,–-]+\S{0,2}$/, "").trim() || "Série";
  }
  return { id: "wd|" + seriesQid, name, parts: clean.filter((x) => x.num != null || x.current).concat(clean.filter((x) => x.num == null && !x.current).slice(0, 15)) };
}
const seriesOrder = (a, b) => (a.num == null) - (b.num == null) || (+a.num || 0) - (+b.num || 0) || (a.year || 9999) - (b.year || 9999);

// „Krvavá říše. 5. díl“, „Urla. 4“, „Oči prázdnoty. 2, Architekti světů“, „(… ze série X – 3. díl)“
function parseSeries(title) {
  const t = String(title || "");
  let m = t.match(/ze série (.+?)\s*[–-]\s*(\d+)\.\s*díl/i);
  if (m) return { name: m[1].trim(), num: m[2] };
  m = t.match(/^(.+?)\.\s*(?:díl|kniha|část|svazek)\s*(\d+)/i);
  if (m) return { name: m[1].trim(), num: m[2] };
  m = t.match(/^(.+?)[.,:]?\s+(\d+)\.?\s*(díl)?\s*(?:[,:–-]\s*.*)?$/i);
  if (m && m[1].length > 2 && !/^\d+$/.test(m[1])) return { name: m[1].replace(/[.:,\s]+$/, "").trim(), num: m[2] };
  m = t.match(/:\s*(.+?)\.?\s+(\d+)\.?$/);
  if (m) return { name: m[1].trim(), num: m[2] };
  return null;
}
async function seriesFromTitle(book) {
  const me = parseSeries(book.title);
  if (!me) return null;
  const author = (book.author || "").split(", ")[0];
  return seriesByName(me.name, author, book, me.num);
}
async function seriesByName(name, author, book = null, myNum = null) {
  const found = await kcSearch(name, "Title", 40);
  const byNum = new Map();
  for (const b of found) {
    const x = parseSeries(b.title);
    if (!x || plain(x.name) !== plain(name)) continue;
    if (author && !sameAuthor(b, author)) continue;
    if (!byNum.has(x.num)) byNum.set(x.num, { title: b.title, num: x.num, year: b.year, book: b });
  }
  if (book && myNum) {
    if (!byNum.has(myNum)) byNum.set(myNum, { title: book.title, num: myNum, year: book.year, book });
    byNum.get(myNum).current = true;
  }
  return { id: ["t", name, author].join("|"), name, author, parts: [...byNum.values()].sort(seriesOrder) };
}
async function seriesById(id) {
  const [kind, a, b] = id.split("|");
  if (kind === "wd") return wdSeriesParts(a);
  if (kind === "t") return seriesByName(a, b);
  return null;
}

// ---------- samostatná stránka série ----------
async function openSeries(id) {
  const page = $("seriesPage");
  closeBook();
  page.hidden = false;
  page.scrollTop = 0;
  document.body.style.overflow = "hidden";
  const back = `<div class="top"><button class="back" id="sBack">← Zpět</button></div>`;
  page.innerHTML = `<div class="wrap">${back}<p class="status">Načítám sérii…</p></div>`;
  $("sBack").onclick = seriesBack;

  let data = seriesCache.get(id);
  if (!data) { try { data = await seriesById(id); } catch {} if (data) seriesCache.set(id, data); }
  if ($("seriesPage").hidden) return;
  if (!data?.parts?.length) {
    page.innerHTML = `<div class="wrap">${back}<div class="empty"><b>📚</b>Sérii se nepodařilo načíst.</div></div>`;
    $("sBack").onclick = seriesBack;
    return;
  }
  const numbered = data.parts.filter((x) => x.num != null);
  const other = data.parts.filter((x) => x.num == null);
  data.author = data.author || "";

  const rowHtml = (x) => {
    const i = data.parts.indexOf(x);
    return `
      <div class="srow" id="sr-${i}">
        <div class="cover" id="sc2-${i}">${x.book ? coverHtml(x.book) : placeholderHtml(x.title, data.author)}</div>
        <div>
          <span class="sbadge">${x.num != null ? esc(x.num) + ". díl" : "mimo pořadí"}</span> <small style="color:var(--muted)">${x.year || ""}</small>
          <h3>${esc(x.title)}</h3>
          <p class="sdesc" id="sd-${i}"></p>
          <div class="actions">
            <button class="btn ghost" data-open="${i}">📖 Otevřít knihu</button>
            <button class="btn ghost" data-read="${i}">✓ Přečteno</button>
          </div>
        </div>
      </div>`;
  };
  page.innerHTML = `
    <div class="wrap" style="padding-bottom:calc(70px + env(safe-area-inset-bottom))">
      ${back}
      <h1>📚 ${esc(data.name)}</h1>
      <p class="by">${numbered.length} ${plural(numbered.length, "díl", "díly", "dílů")}${data.author ? " · " + esc(data.author) : ""}</p>
      <div class="actions" style="margin:12px 0 0"><button class="btn ghost" id="sFollow" style="min-height:40px;padding:8px 14px"></button></div>
      <div class="sprog"><i id="sProgBar"></i></div>
      <p class="status" id="sProg"></p>
      <div class="actions" id="sNextBox"></div>
      <div class="srows">${numbered.map(rowHtml).join("")}</div>
      ${other.length ? `<details class="series-more" style="margin-top:24px"><summary>Další knihy ze stejného světa (${other.length})</summary><div class="srows">${other.map(rowHtml).join("")}</div></details>` : ""}
    </div>`;
  $("sBack").onclick = seriesBack;
  page.querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => openPart(data, data.parts[b.dataset.open])));
  page.querySelectorAll("[data-read]").forEach((b) => (b.onclick = () => {
    const k = partKey(data.parts[b.dataset.read]);
    readParts.has(k) ? readParts.delete(k) : readParts.add(k);
    store.set("prectene-dily", [...readParts]);
    updateSeriesProgress(data);
  }));
  updateSeriesProgress(data);
  const syncFollow = () => {
    const f = follows.series.find((x) => x.id === data.id);
    if (f && f.count !== numbered.length) { f.count = numbered.length; store.set("sledovani", follows); } // otevřením série se „nový díl“ označí jako viděný
    $("sFollow").textContent = f ? "🔔 Sérii sleduješ" : "🔔 Sledovat sérii";
    $("sFollow").classList.toggle("on", !!f);
  };
  syncFollow();
  $("sFollow").onclick = () => {
    const on = follows.series.some((x) => x.id === data.id);
    follows.series = on ? follows.series.filter((x) => x.id !== data.id) : [...follows.series, { id: data.id, name: data.name, author: data.author, count: numbered.length }];
    store.set("sledovani", follows);
    toast(on ? "Sérii už nesleduješ" : "Sérii sleduješ – nový díl uvidíš na úvodní stránce");
    syncFollow();
  };

  // obálky a krátké popisy dílů na pozadí
  data.parts.forEach(async (x, i) => {
    const b = await resolvePart(x, data.author);
    if (!b || $("seriesPage").hidden) return;
    const cov = $("sc2-" + i);
    if (cov) cov.innerHTML = coverHtml(b);
    try {
      let d = b.key.startsWith("kc:") ? kcDesc((await (await fetch(kcRecordUrl(b.kcId))).json()).records?.[0])
        : realDesc(await (await fetch(`${API}${b.key}.json`)).json());
      if (!d) return;
      d = d.slice(0, 400);
      d = (await translate(d)) || d;
      if ($("sd-" + i)) $("sd-" + i).textContent = d.length > 260 ? d.slice(0, 260).replace(/\s+\S*$/, "") + "…" : d;
    } catch {}
  });
}

// ukazatel „přečteno X z N“ a tip, kterým dílem pokračovat
function updateSeriesProgress(data) {
  const numbered = data.parts.filter((x) => x.num != null);
  const done = numbered.filter((x) => readParts.has(partKey(x))).length;
  $("sProgBar").style.width = (numbered.length ? (done / numbered.length) * 100 : 0) + "%";
  $("sProg").textContent = done ? `Přečteno ${done} z ${numbered.length}${done === numbered.length ? " – celá série! 🎉" : ""}` : "Označ díly, které už máš přečtené, a uvidíš, kde pokračovat.";
  const next = numbered.find((x) => !readParts.has(partKey(x)));
  data.parts.forEach((x, i) => {
    const row = $("sr-" + i);
    if (!row) return;
    const read = readParts.has(partKey(x));
    row.classList.toggle("read", read);
    row.classList.toggle("next", x === next && done > 0);
    const btn = row.querySelector("[data-read]");
    btn.classList.toggle("done", read);
    btn.textContent = read ? "✓ Přečteno" : "Označit jako přečtené";
  });
  const box = $("sNextBox");
  box.innerHTML = next && done ? `<button class="btn" id="sNext">📍 Pokračuj: ${esc(next.num)}. díl – ${esc(next.title)}</button>` : "";
  $("sNext")?.addEventListener("click", () => openPart(data, next));
}

// otevře knihu podle názvu (díly série z Wikidat): Open Library → knihovny → Google Books → obyčejné hledání
async function openByTitle(title, author) {
  try {
    const p = new URLSearchParams({ q: `title:(${title})${author ? ` author:(${author})` : ""}`, limit: 1, fields: FIELDS });
    if ($("lang").value) p.set("language", $("lang").value);
    let doc = (await (await fetch(`${API}/search.json?${p}`)).json()).docs?.[0];
    if (!doc && $("lang").value) { p.delete("language"); doc = (await (await fetch(`${API}/search.json?${p}`)).json()).docs?.[0]; }
    if (doc) return location.replace("#" + bookHash(toBook(doc)));
    const kc = (await kcSearch(`${title} ${author}`, "AllFields", 5))[0];
    if (kc) return location.replace("#" + bookHash(kc));
  } catch {}
  location.replace("#");
  setMode("genre");
  $("q").value = title;
  search();
}

// ===================== Překvap mě – jedna náhodná kniha =====================
// Losuje z Open Library (náhodné řazení) i z katalogu českých knihoven (náhodná stránka výsledků).
const lucky = { queue: [], seen: new Set(), filters: "", summaries: {} };

function luckyParams(level, genreQ) {
  // level 0 = všechny filtry, 1 = bez období, 2 = bez období i bez požadavku na oblíbenost
  const lang = $("lang").value;
  const p = new URLSearchParams({ limit: 20, sort: "random_" + Math.floor(Math.random() * 1e9), fields: FIELDS });
  if (lang) p.set("language", lang);
  p.set("q", [
    genreQ,
    $("q").value.trim(),
    "cover_i:[* TO *]",                                          // jen knihy s obálkou
    level < 2 ? `readinglog_count:[${lang ? 1 : 15} TO *]` : "",  // aspoň trochu známé knihy
    level < 1 ? periodQuery($("period").value) : "",
    fmt() === "ebook" ? "ebook_access:[borrowable TO *]" : "",
    lengthRange() ? `number_of_pages_median:[${lengthRange()[0]} TO ${lengthRange()[1]}]` : "",
  ].filter(Boolean).join(" "));
  return p;
}

async function luckyOL() {
  if (fmt() === "audio") return [];
  const genreQ = olGenreQuery(state.genres, state.genreMode);
  if (genreQ === null) return []; // vybraný žánr Open Library nezná – nelosujeme odjinud
  for (let level = 0; level < 3; level++) {
    const data = await (await fetch(`${API}/search.json?${luckyParams(level, genreQ)}`)).json();
    if (data.docs.length) return data.docs.map(toBook);
  }
  return [];
}

async function luckyKC() {
  const spec = kcSpec(true);
  if (!spec) return [];
  const range = PERIODS.find((x) => x[0] === $("period").value)?.[2];
  for (const withPeriod of range ? [true, false] : [false]) {
    const p = kcParams({ lookfor: spec.lookfor, type: spec.type, limit: 0 });
    const lang = KC_LANG[$("lang").value];
    if (lang) p.append("filter[]", `language:"${lang}"`);
    if (withPeriod) p.append("filter[]", `publishDate:[${range[0]} TO ${range[1]}]`);
    kcFormatFilter(p, fmt() || "print");
    const count = (await (await fetch(`${KC_API}/search?${p}`)).json()).resultCount || 0;
    if (!count) continue;
    p.set("limit", 20);
    p.set("page", 1 + Math.floor(Math.random() * Math.min(Math.ceil(count / 20), 50)));
    const recs = (await (await fetch(`${KC_API}/search?${p}`)).json()).records || [];
    recs.forEach((r) => { const d = kcDesc(r); if (d) lucky.summaries[r.id] = d; });
    // přednost mají knihy s obálkou a popisem
    return recs.filter((r) => r.title).map(toKCBook).filter((b) => b.coverUrl && lucky.summaries[b.kcId] && fitsLength(b, lengthRange()));
  }
  return [];
}

const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function nextLucky() {
  const filters = [state.genres.join(","), state.genreMode, $("lang").value, $("period").value, $("q").value, fmt(), $("length").value].join("|");
  if (filters !== lucky.filters) { lucky.filters = filters; lucky.queue = []; }
  for (let attempt = 0; !lucky.queue.length && attempt < 2; attempt++) {
    const [ol, kc] = await Promise.allSettled([luckyOL(), luckyKC()]);
    const all = [...(ol.value || []), ...(kc.value || [])];
    const keys = new Set();
    lucky.queue = shuffle(all.filter((b) => {
      const k = normKey(b.title, b.author);
      if (lucky.seen.has(k) || keys.has(k)) return false;
      keys.add(k);
      return true;
    }));
    if (!lucky.queue.length && all.length) lucky.seen.clear(); // všechno už viděl – začneme znovu
  }
  const book = lucky.queue.shift();
  if (book) lucky.seen.add(normKey(book.title, book.author));
  return book;
}

// ===================== Dnes mají narozeniny (česká Wikipedie) =====================
const MONTHS = ["ledna", "února", "března", "dubna", "května", "června", "července", "srpna", "září", "října", "listopadu", "prosince"];
const WRITER = /spisovatel|básník|básnířk|prozai|dramatik|romanopis|povídkář|esejist/i;
const AUTHOR = /autor/i, NOT_WRITER = /zpěv|hudeb|skladatel|kytar|písní|písně|rapper|herec|hereč/i;
// „autor písní“ ani zpěvák, který píše i básně (hlavní popis „zpěvák“), není spisovatel
const isWriter = (t) => WRITER.test(t) || (AUTHOR.test(t) && !NOT_WRITER.test(t));

async function loadBirthdays() {
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, "0"), dd = String(now.getDate()).padStart(2, "0");
  const storeKey = "narozeniny-" + mm + dd;
  let list = store.get(storeKey, null);
  if (!list) {
    try {
      const data = await (await fetch(`https://api.wikimedia.org/feed/v1/wikipedia/cs/onthisday/births/${mm}/${dd}`)).json();
      list = (data.births || []).filter((x) => x.year > 0 && isWriter(x.text) && !NOT_WRITER.test(x.pages?.[0]?.description || "")).map((x) => {
        const p = x.pages?.[0] || {};
        const [name, ...rest] = x.text.split(", ");
        const about = rest.join(", ").replace(/\s*\(†.*$/, "");
        return {
          name: name.trim(),
          year: x.year,
          dead: x.text.includes("†"),
          deathYear: +(x.text.match(/†[^)]*?(\d{3,4})\s*\)/) || [])[1] || null,
          desc: p.description || about,
          img: p.thumbnail?.source || null,
          czech: /^česk/i.test(p.description || about),
          qid: p.wikibase_item,
        };
      });
      // známost = v kolika jazycích o autorovi píše Wikipedie (Wikidata); čeští autoři mají bonus
      try {
        const ids = list.map((a) => a.qid).filter(Boolean).slice(0, 50);
        const wd = await (await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&props=sitelinks&format=json&origin=*&ids=${ids.join("|")}`)).json();
        list.forEach((a) => { a.fame = Object.keys(wd.entities?.[a.qid]?.sitelinks || {}).length; });
      } catch {}
      try { Object.keys(localStorage).filter((k) => k.startsWith("narozeniny-")).forEach((k) => localStorage.removeItem(k)); } catch {}
      store.set(storeKey, list);
    } catch { return; }
  }
  if (!list.length) return;

  // kulaté výročí: u žijících každých 10 let (kulaté narozeniny), u zemřelých každých 25 let
  const isRound = (a) => { const age = YEAR - a.year; return a.dead ? age % 25 === 0 : age % 10 === 0; };
  // pořadí: kulatá výročí napřed, pak podle známosti (čeští autoři a autoři s fotkou mají bonus)
  const score = (a) => (isRound(a) ? 1000 : 0) + (a.fame || 0) + (a.czech ? 25 : 0) + (a.img ? 5 : 0);
  list.sort((a, b) => score(b) - score(a));

  const box = $("bday");
  box.hidden = false;
  box.innerHTML = `
    <div class="bday-head">
      <h2>🎂 Dnes mají narozeniny</h2>
      <span>${now.getDate()}. ${MONTHS[now.getMonth()]} · zdroj: Wikipedie</span>
    </div>
    <div class="bday-strip">${list.map((a, i) => {
      const age = YEAR - a.year;
      const round = isRound(a);
      const label = a.dead ? `${age} let od narození` : `slaví ${age}. narozeniny`;
      return `
        <button class="bcard" data-i="${i}" title="Zobrazit knihy autora">
          <div class="bphoto">${a.img ? `<img loading="lazy" alt="" src="${esc(a.img)}">` : esc(initials(a.name))}</div>
          <b>${esc(a.name)}</b>
          <small>${esc(a.desc)}</small>
          <small>${a.year}${a.deathYear ? " – " + a.deathYear : ""}</small>
          <span class="bage ${round ? "round" : ""}">${round ? "🎉 " : ""}${label}</span>
        </button>`;
    }).join("")}</div>`;
  box.querySelectorAll(".bcard").forEach((b) => (b.onclick = () => {
    location.hash = "autor-jmeno/" + encodeURIComponent(list[b.dataset.i].name);
    setTimeout(() => $("authorBox").scrollIntoView({ behavior: "smooth", block: "start" }), 400);
  }));
}

const isoDate = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const czDate = (t) => { const d = new Date(t); return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}`; };
const MONTH_SHORT = ["led", "úno", "bře", "dub", "kvě", "čvn", "čvc", "srp", "zář", "říj", "lis", "pro"];

function renderDiary() {
  const box = $("diary");
  const goals = store.get("vyzva", {});
  const years = [...new Set([YEAR, ...lists.read.map((b) => new Date(b.at || Date.now()).getFullYear())])].sort((a, b) => b - a);
  const year = years.includes(state.diaryYear) ? state.diaryYear : YEAR;
  const done = lists.read.filter((b) => new Date(b.at || Date.now()).getFullYear() === year).sort((a, b) => (b.at || 0) - (a.at || 0));
  const goal = +goals[year] || 0;

  // tempo výzvy (jen u letošního roku)
  let pace = "";
  if (goal && year === YEAR) {
    const start = new Date(YEAR, 0, 1), end = new Date(YEAR + 1, 0, 1);
    const expected = Math.floor(goal * (Date.now() - start) / (end - start));
    const diff = done.length - expected;
    pace = done.length >= goal ? "Výzva splněna! 🎉"
      : diff > 0 ? `Jsi o ${diff} ${plural(diff, "knihu", "knihy", "knih")} napřed 👏`
      : diff < 0 ? `Do tempa ti ${plural(-diff, "chybí", "chybí", "chybí")} ${-diff} ${plural(-diff, "kniha", "knihy", "knih")} – to doženeš.`
      : "Držíš přesně tempo 👍";
  }

  // statistiky roku
  const pages = done.reduce((a, b) => a + (+b.pages || 0), 0);
  const noPages = done.filter((b) => !b.pages).length;
  const stars = done.map((b) => myRatings[b.key]?.stars).filter(Boolean);
  const byAuthor = {};
  done.forEach((b) => { const a = (b.author || "").split(", ")[0]; if (a) byAuthor[a] = (byAuthor[a] || 0) + 1; });
  const top = Object.entries(byAuthor).sort((a, b) => b[1] - a[1])[0];
  const perMonth = Array(12).fill(0);

        <div class="sprog" style="max-width:none"><i style="width:${Math.min(100, done.length / goal * 100)}%"></i></div>
        <p class="status">${pace}</p>` : `<p class="status">Kolik knih chceš v roce ${year} přečíst? Nastav si cíl a deník bude hlídat tempo.</p>`}
      <div class="goal">
        <label for="goalInput">Můj cíl:</label>
        <input id="goalInput" type="number" min="1" max="999" inputmode="numeric" value="${goal || ""}" placeholder="např. 20">
        <span>knih</span>
        <button class="btn ghost" id="goalSave" style="min-height:40px;padding:8px 14px">Uložit cíl</button>
      </div>
    </div>

    <div class="section" style="margin-top:0">
      <h2>📊 Rok ${year} v číslech</h2>
      <div class="dtiles">
        <div class="dtile"><b>${done.length}</b><span>${plural(done.length, "přečtená kniha", "přečtené knihy", "přečtených knih")}</span></div>
        <div class="dtile"><b>${pages.toLocaleString("cs-CZ")}</b><span>stran${noPages && done.length ? ` (u ${noPages} ${plural(noPages, "knihy", "knih", "knih")} počet neznáme)` : ""}</span></div>
        <div class="dtile"><b>${stars.length ? "★ " + (stars.reduce((a, b) => a + b, 0) / stars.length).toFixed(1) : "–"}</b><span>tvoje průměrné hodnocení</span></div>
        <div class="dtile"><b style="font-size:1.15rem">${top ? esc(top[0]) : "–"}</b><span>${top ? `nejčtenější autor (${top[1]} ${plural(top[1], "kniha", "knihy", "knih")})` : "nejčtenější autor"}</span></div>

      <h2>📖 Právě čtu <small style="color:var(--muted);font-weight:500">${lists.reading.length || ""}</small></h2>
      ${lists.reading.length ? `<div class="grid" id="dReading"></div>` : `<p class="status">Nic rozečteného. Na stránce knihy klikni na „📖 Právě čtu“.</p>`}
    </div>

    <div class="section" style="margin-top:0">
      <h2>✅ Přečteno v roce ${year} <small style="color:var(--muted);font-weight:500">${done.length || ""}</small></h2>

        <button class="btn ghost" id="backupImport">⬆️ Nahrát zálohu</button>
        <input type="file" id="backupFile" accept="application/json,.json" hidden>

  box.querySelectorAll("[data-year]").forEach((b) => (b.onclick = () => { state.diaryYear = +b.dataset.year; renderDiary(); }));

    const n = Math.max(0, Math.min(999, parseInt($("goalInput").value) || 0));
    const g = store.get("vyzva", {});
    if (n) g[year] = n; else delete g[year];
    store.set("vyzva", g);
    toast(n ? `Cíl na rok ${year}: ${n} ${plural(n, "kniha", "knihy", "knih")}` : "Cíl zrušen");
    renderDiary();
  };

// ===================== Záloha =====================
function exportBackup() {
  const data = {};
  BACKUP_KEYS.forEach((k) => { const v = store.get(k, null); if (v !== null) data[k] = v; });
  const blob = new Blob([JSON.stringify({ app: "Listuj", version: 1, date: new Date().toISOString(), data }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `listuj-zaloha-${isoDate(Date.now())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Záloha stažena");
}

// zálohu přidáme k tomu, co už v prohlížeči je (nic se nesmaže)
function mergeBackup(data) {
  const byKey = (cur, add) => { const have = new Set(cur.map((b) => b.key)); return [...cur, ...add.filter((b) => b && b.key && !have.has(b.key))]; };
  for (const k of ["oblibene", "chci-si-precist", "ctu", "precteno"]) {
    if (Array.isArray(data[k])) store.set(k, byKey(store.get(k, []), data[k]));
  }
  if (data["moje-hodnoceni"] && typeof data["moje-hodnoceni"] === "object") {
    const cur = store.get("moje-hodnoceni", {});
    for (const [key, r] of Object.entries(data["moje-hodnoceni"])) if (!cur[key] || (r.date || 0) > (cur[key].date || 0)) cur[key] = r;
    store.set("moje-hodnoceni", cur);
  }
  if (Array.isArray(data["prectene-dily"])) store.set("prectene-dily", [...new Set([...store.get("prectene-dily", []), ...data["prectene-dily"]])]);
  if (data.vyzva && typeof data.vyzva === "object") store.set("vyzva", { ...data.vyzva, ...store.get("vyzva", {}) });
  if (data.uvitani && !store.get("uvitani", null)) store.set("uvitani", data.uvitani);
  if (data.sledovani) {
    const cur = store.get("sledovani", { authors: [], series: [] });
    const names = new Set(cur.authors.map((a) => plain(a.name)));
    const ids = new Set(cur.series.map((x) => x.id));
    cur.authors.push(...(data.sledovani.authors || []).filter((a) => a?.name && !names.has(plain(a.name))));
    cur.series.push(...(data.sledovani.series || []).filter((x) => x?.id && !ids.has(x.id)));
    store.set("sledovani", cur);
  }
}

async function importBackup(file) {
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch { return toast("Tenhle soubor se nepodařilo přečíst."); }
  if (parsed?.app !== "Listuj" || !parsed.data) return toast("Tohle není záloha z aplikace Listuj.");
  const n = (parsed.data.precteno || []).length + (parsed.data.oblibene || []).length + (parsed.data["chci-si-precist"] || []).length + (parsed.data.ctu || []).length;
  if (!confirm(`Záloha z ${czDate(parsed.date)} obsahuje ${n} ${plural(n, "knihu", "knihy", "knih")} v seznamech.\n\nPřidáme ji k tomu, co tu už máš – nic se nesmaže. Pokračovat?`)) return;
  mergeBackup(parsed.data);
  toast("Záloha nahrána ✓");
  setTimeout(() => location.reload(), 900);
}

async function shareBook(book) {
  const url = location.origin + location.pathname + "#" + bookHash(book);
  const data = { title: book.title, text: `${book.title}${book.author ? " – " + book.author : ""} · tip z aplikace Listuj`, url };
  if (navigator.share) {
    try { await navigator.share(data); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Odkaz zkopírován – vlož ho do zprávy"); }
  catch { prompt("Zkopíruj si odkaz na knihu:", url); }
}

// úvodní stránka: novinky od sledovaných autorů (poslední 2 roky) a nové díly sledovaných sérií
async function loadFollowed() {
  const box = $("followed");
  if (!follows.authors.length && !follows.series.length) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `
    <div class="bday-head"><h2>🔔 Sleduješ</h2><span>novinky od tvých autorů a sérií</span></div>
    <div class="genres" style="margin-bottom:10px">
      ${follows.authors.map((a) => `<a class="chip" href="${a.key ? "#autor/" + a.key : "#autor-jmeno/" + encodeURIComponent(a.name)}">✍️ ${esc(a.name)}</a>`).join("")}
      ${follows.series.map((x, i) => `<a class="chip" id="fs-${i}" href="#serie/${encodeURIComponent(x.id)}">📚 ${esc(x.name)}</a>`).join("")}
    </div>
    <div class="strip" id="followedStrip"></div>
    <p class="status" id="followedNote">${follows.authors.length ? "Hledám novinky…" : ""}</p>`;
  box.querySelectorAll("a.chip").forEach((a) => (a.onclick = () => { state.fromApp = true; }));

  const known = knownKeys();
  const per = await Promise.all(follows.authors.slice(0, 8).map(async (a) => {
    const out = [];
    try { out.push(...(await kcSearch(`"${a.name}"`, "Author", 12)).filter((b) => sameAuthor(b, a.name))); } catch {}
    if (a.key) {
      try {
        const p = new URLSearchParams({ author_key: a.key, sort: "new", limit: 6, fields: FIELDS });
        if ($("lang").value) p.set("language", $("lang").value);
        out.push(...(await (await fetch(`${API}/search.json?${p}`)).json()).docs.map(toBook));
      } catch {}
    }
    return out.filter((b) => b.year >= YEAR - 1).map((b) => ({ b, who: a.name }));
  }));
  // od každého autora nejvýš 4 nejnovější knihy, autoři se střídají
  const seen = new Set();
  const lanes = per.map((list) => list.sort((x, y) => (y.b.year || 0) - (x.b.year || 0)).filter(({ b }) => {
    const k = normKey(b.title, b.author);
    if (seen.has(k) || known.has(k)) return false;
    seen.add(k);
    return true;
  }).slice(0, 4));
  const fresh = [];
  for (let i = 0; i < 4; i++) lanes.forEach((lane) => lane[i] && fresh.length < 14 && fresh.push(lane[i]));
  if (!$("followedStrip")) return;
  fresh.forEach(({ b, who }) => {
    const el = card(b);
    el.insertAdjacentHTML("beforeend", `<div class="cap">nové od: ${esc(who)}</div>`);
    $("followedStrip").appendChild(el);
  });
  $("followedNote").textContent = fresh.length || !follows.authors.length ? "" : "Od sledovaných autorů teď není nic nového.";

  // série: přibyl díl od doby, kdy ji uživatel naposledy otevřel?
  follows.series.slice(0, 5).forEach(async (x, i) => {
    try {
      const d = await seriesById(x.id);
      const n = d?.parts.filter((y) => y.num != null).length || 0;
      if (d) seriesCache.set(x.id, d);
      if (n > (x.count || 0) && $("fs-" + i)) { $("fs-" + i).classList.add("new"); $("fs-" + i).textContent = `📚 ${x.name} · nový díl!`; }
    } catch {}
  });
}

// ===================== Pro tebe: doporučení podle oblíbených a dobře hodnocených knih =====================
async function loadForYou() {
  const box = $("forYou");
  const disliked = new Set(Object.entries(myRatings).filter(([, r]) => r.stars <= 2).map(([k]) => k));
  const likedAll = [...lists.fav, ...Object.values(myRatings).filter((r) => r.stars >= 4).map((r) => r.book), ...lists.read, ...lists.reading]
    .filter((b) => b && !disliked.has(b.key));
  const liked = [...new Map(likedAll.map((b) => [b.key, b])).values()];
  if (!liked.length) return forYouByGenres(box);
  box.hidden = false;
  box.innerHTML = `
    <div class="bday-head"><h2>✨ Pro tebe</h2><span>podle knih, které se ti líbily · <button class="linkbtn" id="forYouMore">↻ jiné tipy</button></span></div>
    <div class="strip" id="forYouStrip">${skeletons(6)}</div>`;
  $("forYouMore").onclick = loadForYou;

  const seeds = shuffle([...liked]).slice(0, 3);
  const known = knownKeys();
  const per = await Promise.all(seeds.map(async (seed) => {
    try { return (await similarFromInfo(seed, await bookInfo(seed))).map((b) => ({ b, seed })); } catch { return []; }
  }));
  // střídavě od každé „výchozí“ knihy, nejvýš 2 knihy od jednoho autora
  const picks = [], seen = new Set(), perAuthor = {};
  for (let i = 0; i < 20 && picks.length < 14; i++) {
    for (const list of per) {
      const x = list[i];
      if (!x) continue;
      const k = normKey(x.b.title, x.b.author), a = (x.b.author || "").split(", ")[0];
      if (seen.has(k) || known.has(k) || perAuthor[a] >= 2) continue;
      seen.add(k); perAuthor[a] = (perAuthor[a] || 0) + 1;
      picks.push(x);
    }
  }
  const strip = $("forYouStrip");
  if (!strip) return;
  strip.innerHTML = "";
  if (!picks.length) { strip.outerHTML = `<p class="status">Zatím jsme nenašli vhodné tipy. Přidej si pár knih do oblíbených nebo je ohodnoť.</p>`; return; }
  picks.forEach(({ b, seed }) => {
    const el = card(b);
    el.insertAdjacentHTML("beforeend", `<div class="cap">protože se ti líbí: ${esc(seed.title)}</div>`);
    strip.appendChild(el);
  });
}

async function welcomeBooks() {
  const gq = olGenreQuery(welcome.genres, "any") || "";

  };
  let books = await get($("lang").value);
  if (books.length < 8 && $("lang").value) books = [...books, ...(await get(""))];
  // bez duplicit a nejvýš 2 knihy od jednoho autora, ať je z čeho vybírat
  const seen = new Set(), perAuthor = {};
  return books.filter((b) => {
    const k = normKey(b.title, b.author), a = (b.author || "").split(", ")[0];
    if (seen.has(k) || perAuthor[a] >= 2) return false;
    seen.add(k);
    perAuthor[a] = (perAuthor[a] || 0) + 1;
    return true;
  }).slice(0, 18);
}

  const dots = `<div class="wdots">${[1, 2, 3].map((n) => `<i class="${n <= welcome.step ? "on" : ""}"></i>`).join("")}</div>`;

    dlg.innerHTML = `<div class="wel">${dots}
      <h2>Vítej v Listuj 👋</h2>
      <p>Pomůžeme ti najít další knihu. Nejdřív nám řekni, <b>co ráda/rád čteš</b> – vyber klidně víc žánrů.</p>

    dlg.querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => {
      const id = b.dataset.g;
      welcome.genres = welcome.genres.includes(id) ? welcome.genres.filter((g) => g !== id) : [...welcome.genres, id];

    }));

  } else if (welcome.step === 2) {
    dlg.innerHTML = `<div class="wel">${dots}
      <h2>Které z nich se ti líbily?</h2>

    $("wBack").onclick = () => { welcome.step = 1; renderWelcome(); };
    $("wNext").onclick = () => { welcome.step = 3; renderWelcome(); };
    (async () => {

      grid.innerHTML = welcome.books.map((b, i) => `

    $("wBack").onclick = () => { welcome.step = 2; renderWelcome(); };

  }

// ===================== Hledání knihy podle názvu (našeptávač) =====================
// Při psaní nabízí konkrétní knihy a autory; klik otevře stránku knihy (s díly série a podobnými knihami).
const omni = { timer: null, ctrl: null, items: [], active: -1, text: "" };

async function omniSuggest(text) {
  omni.ctrl?.abort();
  omni.ctrl = new AbortController();
  const signal = omni.ctrl.signal;
  const lang = $("lang").value;
  const ol = async (withLang) => {
    const p = new URLSearchParams({ q: text, limit: 8, sort: "readinglog", fields: FIELDS });
    if (withLang && lang) p.set("language", lang);
    return (await (await fetch(`${API}/search.json?${p}`, { signal })).json()).docs.map(toBook);
  };
  const gbLang = GB_LANG[lang];
  const [olLang, olAll, kc, authors, gb] = await Promise.allSettled([
    lang ? ol(true) : Promise.resolve([]),
    ol(false),
    KC_LANG[lang] || !lang ? kcSearch(text, "Title", 10, "") : Promise.resolve([]), // podle shody s názvem, ne podle data
    fetch(`${API}/search/authors.json?q=${encodeURIComponent(text)}&limit=5`, { signal }).then((r) => r.json()),
    // Google Books zná dobře české názvy („Hra o trůny“), které Open Library nemá
    GOOGLE_BOOKS_KEY ? fetch(`${GB_API}?${new URLSearchParams({ q: `intitle:${text}`, maxResults: 10, printType: "books", key: GOOGLE_BOOKS_KEY, ...(gbLang ? { langRestrict: gbLang } : {}) })}`, { signal })
      .then((r) => r.json()).then((d) => (d.items || []).filter((it) => it.volumeInfo.title && it.volumeInfo.authors && (!gbLang || it.volumeInfo.language === gbLang)).map(toGBook))
      : Promise.resolve([]),
  ]);
  if (signal.aborted) return null;
  // české vydání napřed, pak zbytek světa, pak nové české knihy z knihoven
  const books = [], keys = new Set();
  const q0 = plain(text);
  const starts = (b) => plain(b.title).startsWith(q0) || plain(b.original || "").startsWith(q0);
  const pool = [...(olLang.value || []), ...(olAll.value || []), ...(gb.value || []), ...(kc.value || [])];
  // knihy, jejichž název začíná hledaným textem, napřed; průvodce a „kompletní“ příručky až nakonec
  const guide = (b) => /průvodce|neoficiální|encyklopedie|kuchařka|omalovánk/i.test(b.title);
  pool.sort((a, b) => (guide(a) - guide(b)) || (starts(b) - starts(a)));
  for (const b of pool) {
    const k = normKey(b.title, b.author);
    const k2 = b.original ? normKey(b.original, b.author) : null;
    if (keys.has(k) || (k2 && keys.has(k2))) continue;
    keys.add(k); if (k2) keys.add(k2);
    books.push(b);
    if (books.length >= 7) break;
  }
  // autory ukážeme, jen když jméno opravdu odpovídá hledanému textu
  const words = plain(text).split(/\s+/).filter((w) => w.length > 1);
  const people = (authors.value?.docs || [])
    .filter((a) => a.work_count > 0 && words.every((w) => plain(a.name).includes(w)))
    .sort((a, b) => b.work_count - a.work_count)
    // „Harry Potter“ je název knihy, ne autor – autory pak ukážeme, jen když napsali některou z nalezených knih
    .filter((a) => !books.some((b) => plain(b.title).includes(plain(text))) || books.some((b) => sameAuthor(b, a.name)))
    .slice(0, 2);
  return { books, people };
}

function omniRender(res) {
  const list = $("omniList");
  omni.items = [];
  omni.active = -1;
  if (!res) return;
  const rows = [];
  if (res.people.length) {
    rows.push(`<div class="head">Autoři</div>`);
    res.people.forEach((a) => {
      omni.items.push({ type: "author", a });
      rows.push(`<button class="orow" role="option" data-i="${omni.items.length - 1}">
        <span class="av"><img alt="" src="https://covers.openlibrary.org/a/olid/${a.key}-S.jpg?default=false" onerror="this.replaceWith(document.createTextNode('${esc(initials(a.name)).replace(/'/g, "")}'))"></span>
        <span><b>${esc(a.name)}</b><small>${a.work_count} ${plural(a.work_count, "kniha", "knihy", "knih")}${a.top_work ? " · např. " + esc(a.top_work) : ""}</small></span></button>`);
    });
  }
  if (res.books.length) {
    rows.push(`<div class="head">Knihy</div>`);
    res.books.forEach((b) => {
      omni.items.push({ type: "book", b });
      rows.push(`<button class="orow" role="option" data-i="${omni.items.length - 1}">
        <span class="mini">${coverHtml(b, "S")}</span>
        <span><b>${esc(b.title)}</b><small>${esc(b.author || "Neznámý autor")}${b.year ? " · " + b.year : ""}${b.original ? " · " + esc(b.original) : ""}</small></span></button>`);
    });
  }
  if (!rows.length) rows.push(`<div class="omni-note">Nic jsme nenašli. Zkus jiný zápis názvu nebo jména.</div>`);
  rows.push(`<button class="btn ghost omni-all" data-all="1">Zobrazit všechny výsledky pro „${esc(omni.text)}“</button>`);
  list.innerHTML = rows.join("");
  list.hidden = false;
  list.querySelectorAll("[data-i]").forEach((el) => (el.onclick = () => omniPick(+el.dataset.i)));
  list.querySelector("[data-all]").onclick = omniAll;
}

function omniPick(i) {
  const it = omni.items[i];
  if (!it) return omniAll();
  $("omniList").hidden = true;
  state.fromApp = true;
  rememberQuery(omni.text);
  if (it.type === "author") location.hash = "autor/" + it.a.key;
  else { cache.set(it.b.key, it.b); location.hash = bookHash(it.b); }
}

// Enter / „Zobrazit všechny výsledky“: klasické hledání podle textu bez omezení období a žánru
function omniAll() {
  const text = $("omni").value.trim();
  if (!text) return;
  $("omniList").hidden = true;
  rememberQuery(text);
  if (location.hash.startsWith("#autor")) location.hash = "";

$("omni").addEventListener("input", () => {
  clearTimeout(omni.timer);
  const text = $("omni").value.trim();
  omni.text = text;
  if (text.length < 3) { omni.ctrl?.abort(); if (text) $("omniList").hidden = true; else omniRecent(); return; }
  $("omniList").hidden = false;
  $("omniList").innerHTML = `<div class="omni-note">Hledám „${esc(text)}“…</div>`;
  omni.timer = setTimeout(async () => {
    try { const res = await omniSuggest(text); if (res && text === omni.text) omniRender(res); }
    catch (e) { if (e.name !== "AbortError") $("omniList").innerHTML = `<div class="omni-note">Hledání se nepovedlo, zkus to znovu.</div>`; }
  }, 300);
});
$("omni").addEventListener("keydown", (e) => {
  const rows = [...$("omniList").querySelectorAll("[data-i]")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!rows.length) return;
    e.preventDefault();
    omni.active = (omni.active + (e.key === "ArrowDown" ? 1 : -1) + rows.length) % rows.length;
    rows.forEach((r, i) => r.classList.toggle("active", i === omni.active));
    rows[omni.active].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (omni.active >= 0 && !$("omniList").hidden) omniPick(+rows[omni.active].dataset.i); else omniAll();
    $("omni").blur();
  } else if (e.key === "Escape") {
    $("omniList").hidden = true;
  }
});
$("omni").addEventListener("focus", () => {
  if (!$("omni").value.trim()) omniRecent();
  else if (omni.items.length && $("omni").value.trim().length >= 3) $("omniList").hidden = false;
});
// prázdné pole: nabídneme poslední hledání
function omniRecent() {
  const list = $("omniList");
  if (!historyData.queries.length) { list.hidden = true; return; }

  list.hidden = false;

}

// ===================== Automatický překlad =====================
const translations = new Map();
async function translate(text) {
  if (translations.has(text)) return translations.get(text);
  try {
    const chunks = text.match(/[\s\S]{1,1800}(?=\s|$)/g) || [text];
    const results = await Promise.all(chunks.map(async (chunk) => {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=cs&dt=t&q=" + encodeURIComponent(chunk);
      return (await fetch(url)).json();
    }));
    if (results[0][2] === "cs") return text; // už je česky
    const out = results.map((j) => j[0].map((x) => x[0]).join("")).join(" ");
    translations.set(text, out);
    return out;
  } catch {
    return null;
  }
}

// ===================== Pomocné =====================
// popis, který není skutečný popis (např. „1 volume : 24 cm“), bereme jako žádný
function realDesc(work) {
  const raw = typeof work.description === "string" ? work.description : work.description?.value;
  if (!raw) return null;
  const text = cleanDesc(raw);
  return text.length < 60 || /^\s*\d+\s*(volume|v\.|p\.|pages)|\d+\s*cm/i.test(text) ? null : text;
}
function gbDesc(vol) {
  const html = vol?.volumeInfo?.description;
  if (!html) return null;
  const doc = new DOMParser().parseFromString(html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n\n"), "text/html");
  const text = doc.body.textContent.replace(/\n{3,}/g, "\n\n").trim();
  return text.length >= 60 ? text : null;
}
function cleanDesc(s) {
  return s.split(/\n-{3,}|\(\[source\]|\[source\]/i)[0]
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/\r/g, "").trim();
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function initials(name) { return (name || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase(); }
function plural(n, one, few, many) { return n === 1 ? one : n >= 2 && n <= 4 ? few : many; }

function route() {
  const about = location.hash.match(/^#(o-aplikaci|napis-nam)$/);
  if (about) return openAbout(about[1] === "napis-nam");
  closeAbout();
  const seriesId = location.hash.match(/^#serie\/(.+)$/);
  if (seriesId) return openSeries(decodeURIComponent(seriesId[1]));
  closeSeries();
  const book = location.hash.match(/^#kniha\/(OL\w+W)$/);
  const gbook = location.hash.match(/^#kniha\/gb\/([\w-]+)$/);
  const kbook = location.hash.match(/^#kniha\/kc\/(.+)$/);
  const findTitle = location.hash.match(/^#najit\/([^/]+)\/(.*)$/);
  if (findTitle) return openByTitle(decodeURIComponent(findTitle[1]), decodeURIComponent(findTitle[2]));
  const author = location.hash.match(/^#autor\/(OL\w+A)$/);
  const authorName = location.hash.match(/^#autor-jmeno\/(.+)$/);
  if (book) return openBook(book[1]);
  if (gbook) return openBook(gbook[1], "gb");
  if (kbook) return openBook(decodeURIComponent(kbook[1]), "kc");
  closeBook();
  if (author) loadAuthor(author[1]);
  else if (authorName) {
    const name = decodeURIComponent(authorName[1]);
    if (state.author?.name !== name || state.author.key) {  // jinak je už načtený
      setMode("author");
      $("q").value = name;
      state.author = null;
      findAuthor(true);
    }
  }
  else if (state.mode === "author" && state.author) { setMode("genre"); state.searched = false; search(); }
}
